<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Svi dolasci · Mala pošta</title>
<style>
:root{--blue:#0063F0;--navy:#002974;--ink:#0A2342;--orange:#DA5D23;--purple:#6352C4;
 --green:#12693A;--green-bg:#E7F6EC;--amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 9px) 14px 10px}
.top__r1{display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top__t{flex:1;min-width:0}
.top__meta{flex:none;text-align:right;line-height:1.3}
.top__dir{font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap}
.top__nm{font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--navy);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap;margin-top:1px}
.livewave{width:13px;height:13px;flex:none;color:#12693A;margin-right:4px;vertical-align:-1px;
 animation:livepulse 1.8s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.livewave{animation:none}}

.dot{width:5.5px;height:5.5px;border-radius:50%;background:#16A34A;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.segs{display:flex;gap:3px;margin:10px 0 0;background:#EEF1F7;border-radius:11px;padding:3px}
.seg{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-family:var(--font);font-size:12.5px;
 font-weight:600;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,41,116,.12)}
.legend{padding:7px 2px 9px;font-size:10.5px;color:var(--dim)}

.disr{display:none;gap:9px;align-items:flex-start;background:var(--amber-bg);
 border-bottom:1px solid var(--amber-line);padding:9px 14px;color:#5C3B00;flex:none}
.disr.on{display:flex}
.disr svg{width:15px;height:15px;flex:none;color:var(--amber);margin-top:1px}
.disr b{display:block;font-size:11.5px;font-weight:700}
.disr p{font-size:11px;line-height:1.32;margin-top:1px;color:#6E4E15}

.list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px}
.hd{position:sticky;top:0;z-index:2;background:var(--card);padding:12px 2px 6px;
 font-size:10.5px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--muted)}
ul.arr{list-style:none;padding:0}
ul.arr li{border-bottom:1px solid #EDF0F6}
ul.arr li:last-child{border-bottom:0}
.rowlink{display:grid;grid-template-columns:auto 1fr auto auto;
 grid-template-areas:"badge dest val chev" "next next next next";
 align-items:center;column-gap:11px;row-gap:3px;padding:11px 2px 12px;text-decoration:none;color:inherit}
.rowlink:active{background:#F1F4FA;border-radius:9px}
.chev{grid-area:chev;width:8px;height:13px;flex:none;color:#C9D1DE;margin-left:1px}
body.nochev .chev{display:none}
body.nochev .rowlink{grid-template-columns:auto 1fr auto}
.badge{grid-area:badge;flex:none;min-width:34px;height:24px;border-radius:7px;color:#fff;padding:0 6px;font-family:var(--font);
 font-size:12.5px;font-weight:700;line-height:24px;text-align:center}
.l1{background:var(--orange)}.l2{background:var(--blue)}.l3{background:var(--purple)}
.l4{background:#0F7B6C}.l5{background:#B8437E}.l6{background:#3D6BB3}
.mid{min-width:0}
.dest{grid-area:dest;font-size:16.5px;font-weight:600;letter-spacing:-.015em;color:var(--navy);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:11.5px;font-weight:600;line-height:1.3;color:var(--muted);margin-left:9px}
.note.a{color:var(--amber)}.note.b{color:var(--blue)}
.nexts{grid-area:next;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;padding-left:45px}
.nextt{font-size:12.5px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.nextt+.nextt::before{content:"·";margin:0 7px;color:#C9D1DE}
ul.arr li.off .nextt{color:var(--dim)}
.sub{display:block;font-size:11px;font-weight:600;line-height:1.3;margin-top:2px;color:var(--muted)}
.sub.b{color:var(--blue)}.sub.a{color:var(--amber)}.sub.g{color:var(--green)}
.sub .nx{font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.right{text-align:right;min-width:58px}
.rlab{display:block;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 color:var(--dim);line-height:1.1}
.rval{grid-area:val;display:flex;align-items:baseline;justify-content:flex-end;font-size:18px;font-weight:700;
 color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.rval small{font-size:11.5px;font-weight:600;color:var(--dim);margin-left:1px}
.rval.live{color:var(--blue)}.rval.live small{color:var(--muted)}
li.off .dest{color:var(--dim)}
li.off .rval{text-decoration:line-through;text-decoration-thickness:1.6px}
.foot{flex:none;padding:9px 14px calc(env(safe-area-inset-bottom) + 10px);background:rgba(249,249,251,.96);
 border-top:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cta{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:12px 14px;
 font-family:var(--font);text-align:center;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.cta b{display:block;font-size:17.5px;font-weight:700;letter-spacing:-.015em;line-height:1.18}
.cta i{display:block;font-style:normal;font-size:16px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
@media (max-height:640px){.rowlink{padding:9px 2px 10px}.hd{padding:9px 2px 5px}.disr{padding:8px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}
</style>
</head>
<body>

<div class="top">
  <div class="top__r1">
    <a class="back" href="./index.html" aria-label="Natrag">
      <svg viewBox="0 0 16 16" fill="none"><path d="M10 2 4 8l6 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="top__t"><div class="top__nm">Mala pošta</div></div>
    <div class="top__meta">
      <div class="top__dir">smjer Kolodvor</div>
      <div class="upd" id="updPill"><span id="updTxt"></span></div>
    </div>
  </div>
</div>

<div class="disr on">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 21 19H3l9-15.4Z"/><path d="M12 9.5v4.2M12 16.4h.01"/></svg>
  <div><b data-i18n="disr.title"></b><p>Radovi na Obali kneza Trpimira, linija 7 ne prometuje do 16:30.</p></div>
</div>

<div class="list">
  <div class="hd" data-i18n="arrivals.title"></div>
  <ul class="arr" id="arrList"></ul>
</div>

<div class="foot">
  <button class="cta" type="button"><b id="ctaMain"></b><i>1,50 €</i></button>
</div>
