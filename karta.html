<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Jednokratna karta · Liburnija d.o.o.</title>
<script src="./qrcode.js"></script>
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 9px) 14px 10px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--navy)}
.wrap{flex:1 1 auto;padding:14px 14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.foot{flex:none;position:sticky;bottom:0;background:rgba(249,249,251,.97);border-top:1px solid var(--line);
 padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:15px 14px;
 font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center;
 text-decoration:none;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.btn:active{background:var(--blue-dark);transform:translateY(1px)}
.btn[disabled],.btn.off{background:#DDE3EC;color:#9AA6BC;box-shadow:none;pointer-events:none}
.btn2{display:block;width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);
 padding:13px;font-family:var(--font);font-size:15px;font-weight:600;text-align:center;text-decoration:none}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

body{background:linear-gradient(180deg,#0A5BA8 0%,#1478C8 42%,#E8EEF4 42%,var(--card) 100%)}
.tkwrap{flex:1;padding:14px 14px 0}
.tkhead{display:flex;align-items:center;gap:11px;padding:0 0 12px}
.tkhead .back{background:rgba(255,255,255,.9)}
.tkhead h1{flex:1;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.02em}
.ticket{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(10,35,66,.18);overflow:hidden}
.tk__top{padding:18px 18px 16px;text-align:center}
.tk__nm{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.badge-off{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:#F0F3F8;color:var(--muted);
 border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.badge-off .d{width:7px;height:7px;border-radius:50%;background:#A9B4C9}
.clocknote{font-size:13px;color:var(--muted);margin-top:11px;line-height:1.4}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:16px}
.fact{background:#fff;padding:12px 14px}
.fact__l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.fact__v{font-size:17px;font-weight:700;color:var(--navy);margin-top:2px}
.perf{position:relative;height:22px;background:#fff}
.perf::before,.perf::after{content:"";position:absolute;top:50%;transform:translateY(-50%);
 width:22px;height:22px;border-radius:50%;background:var(--card)}
.perf::before{left:-11px}.perf::after{right:-11px}
.perf i{position:absolute;left:14px;right:14px;top:50%;height:1px;
 background:repeating-linear-gradient(90deg,#D7DDE8 0 5px,transparent 5px 11px)}
.tk__qr{padding:4px 18px 18px;text-align:center;background:#fff}
.qrno{font-size:12px;color:var(--muted)}
.qrno b{color:var(--navy);font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;margin-left:5px}
#qr{margin:12px auto 0;width:min(232px,62vw);aspect-ratio:1/1;display:grid;place-items:center}
#qr img,#qr canvas,#qr table{width:100%;height:100%;image-rendering:pixelated}
.qrhint{font-size:12.5px;color:var(--muted);margin-top:11px;line-height:1.4}
.rot{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;font-weight:600;color:var(--dim)}
.rot .d{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.savebtn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#0A2342;color:#fff;
 border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;z-index:30}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="tkwrap">
  <div class="tkhead">
    <a class="back" href="./index.html" aria-label="Natrag"><svg viewBox="0 0 16 16" fill="none"><path d="M10 2 4 8l6 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 data-i18n="tkt.title"></h1>
  </div>
  <div class="ticket">
    <div class="tk__top">
      <div class="tk__nm" data-i18n="tkt.title"></div>
      <div class="badge-off"><span class="d"></span><span data-i18n="tkt.inactive"></span></div>
      <p class="clocknote" data-i18n="tkt.clockNote"></p>
    </div>
    <div class="facts">
      <div class="fact"><div class="fact__l" data-i18n="tkt.pax"></div><div class="fact__v" id="fPax">—</div></div>
      <div class="fact"><div class="fact__l" data-i18n="tkt.price"></div><div class="fact__v" id="fPrice">—</div></div>
    </div>
    <div class="perf"><i></i></div>
    <div class="tk__qr">
      <div class="qrno"><span data-i18n="tkt.no"></span><b id="tno">—</b></div>
      <div id="qr"></div>
      <p class="qrhint" data-i18n="tkt.showDriver"></p>
      <span class="rot"><span class="d"></span><span data-i18n="tkt.rotating"></span></span>
    </div>
  </div>
  <a class="btn2 savebtn" id="save" href="#" data-i18n="tkt.save"></a>
</div>
<div class="toast" id="toast" data-i18n="tkt.saved"></div>

const PSEUDO=new URLSearchParams(location.search).has('pseudo');
function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}
let CUR=(document.cookie.match(/(?:^|; )lang=([a-z]{2})/)||[])[1]||detectLang();
function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}
function applyI18n(){document.documentElement.lang=CUR;
 const b=document.getElementById('langCode'); if(b) b.textContent=CUR.toUpperCase();
 document.querySelectorAll('[data-i18n]').forEach(e=>{
   let s=t(e.dataset.i18n,CUR);
   if(e.dataset.price) s=s.replace('{price}',e.dataset.price);
   e.textContent=s;});}

const PRICE=1.5;
function eur(n){ return n.toFixed(2).replace('.',',')+' €'; }
function orderStore(){ try{ return JSON.parse(localStorage.getItem('orders')||'{}'); }catch(e){ return {}; } }
function orderSave(o){ try{ const s=orderStore(); s[o.no]=o; localStorage.setItem('orders',JSON.stringify(s));
  localStorage.setItem('lastOrder',o.no);}catch(e){} }
function orderGet(no){ return orderStore()[no]||null; }
function mkOrderNo(){ const d=new Date();
  return 'ZD-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+
    String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function mkTicketNo(){ const p=()=>Math.random().toString(36).slice(2,6).toUpperCase();
  return p()+'-'+p()+'-'+p(); }

const no=new URLSearchParams(location.search).get('no')||localStorage.getItem('lastOrder');
const o=orderGet(no);
if(!o||o.status!=='paid'){ location.replace('./index.html'); }
else{
  applyI18n();
  document.getElementById('fPax').textContent=o.pax;
  document.getElementById('fPrice').textContent=eur(o.total);
  document.getElementById('tno').textContent=o.ticket;
  /* Rotirajuci kod: token se racuna lokalno iz broja karte i vremenskog prozora,
     pa QR radi i bez mreze. Validator provjerava potpis offline.            */
  function token(){
    const win=Math.floor(Date.now()/5000);
    let h=0, s=o.ticket+'|'+win+'|'+o.pax;
    for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
    return 'LIB1|'+o.ticket+'|'+win+'|'+h.toString(36).toUpperCase();
  }
  function draw(){
    const q=qrcode(0,'M'); q.addData(token()); q.make();
    document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
  }
  draw(); setInterval(draw,5000);
  const save=document.getElementById('save');
  save.onclick=e=>{ e.preventDefault();
    const url=location.origin+location.pathname+'?no='+encodeURIComponent(o.no);
    const done=()=>{ const t=document.getElementById('toast'); t.classList.add('on');
      setTimeout(()=>t.classList.remove('on'),1800); };
    if(navigator.share){ navigator.share({title:'Liburnija',url:url}).then(done).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done).catch(()=>{}); }
    else done();
  };
  /* ekran ostaje upaljen dok je karta otvorena */
  if('wakeLock' in navigator){ navigator.wakeLock.request('screen').catch(()=>{}); }
}
