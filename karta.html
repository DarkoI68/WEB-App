<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Jednokratna karta · Liburnija d.o.o.</title>
<script src="./qrcode.js"></script>
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 9px) 14px 10px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--navy)}
.wrap{flex:1 1 auto;padding:14px 14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.foot{flex:none;position:sticky;bottom:0;background:rgba(249,249,251,.97);border-top:1px solid var(--line);
 padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:15px 14px;
 font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center;
 text-decoration:none;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.btn:active{background:var(--blue-dark);transform:translateY(1px)}
.btn[disabled],.btn.off{background:#DDE3EC;color:#9AA6BC;box-shadow:none;pointer-events:none}
.btn2{display:block;width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);
 padding:13px;font-family:var(--font);font-size:15px;font-weight:600;text-align:center;text-decoration:none}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

body{background:linear-gradient(180deg,#0A5BA8 0%,#1478C8 42%,#E8EEF4 42%,var(--card) 100%)}
.tkwrap{flex:1;padding:14px 14px calc(env(safe-area-inset-bottom) + 22px)}
.tkhead{display:flex;align-items:center;gap:11px;padding:0 0 9px}
.tkhead .back{background:rgba(255,255,255,.9)}
.tkhead h1{flex:1;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.02em}
.ticket{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(10,35,66,.18);overflow:hidden}
.tk__top{padding:14px 18px 6px;text-align:center}
.tk__nm{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.025em}
.badge-off{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:#F0F3F8;color:var(--muted);
 border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.badge-off .d{width:7px;height:7px;border-radius:50%;background:#A9B4C9}
.clocknote{font-size:13px;color:var(--muted);margin-top:11px;line-height:1.4}
.facts{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;padding:0 8px}
.fact{text-align:center;padding:2px 8px}
.fact+.fact{border-left:1px solid var(--line)}
.fact__l{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
 color:var(--muted);line-height:1.2}
.fact__v{display:block;font-size:21px;font-weight:700;color:var(--navy);margin-top:5px;letter-spacing:-.02em;
 line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* prekidac Karta / Voznja — samo kad je karta aktivna */
.segs{display:none;gap:0;margin:16px 16px 2px;background:#F1F4F9;border-radius:13px;padding:3px}
.segs.on{display:flex}
.segs button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font-family:var(--font);
 font-size:15px;font-weight:600;color:#5B6B85;transition:background .18s,color .18s}
.segs button[aria-selected="true"]{background:var(--blue);color:#fff;font-weight:700;
 box-shadow:0 3px 10px rgba(0,99,240,.3)}

/* ---- panel Vožnja ---- */
.ride{display:none;padding:14px 16px 4px}
.ride.on{display:block}
.ridehd{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.lbadge{flex:none;min-width:34px;height:27px;border-radius:8px;background:var(--blue);color:#fff;
 font-size:14px;font-weight:700;line-height:27px;text-align:center;padding:0 7px}
.ridehd__d{flex:1;min-width:0;font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.022em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ridehd__p{flex:none;display:inline-flex;align-items:center;gap:5px;background:var(--green-bg);color:var(--green);
 border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ridehd__p .d{width:6px;height:6px;border-radius:50%;background:#16A34A;animation:pl 2s ease-in-out infinite}
.rlist{list-style:none;padding:6px 0 0;margin:0;position:relative}
.rlist li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:11px;min-height:40px;position:relative}
.rrail{position:relative;height:100%;display:grid;place-items:center}
.rrail::before,.rrail::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:2px;background:var(--line)}
.rrail::before{top:0;height:50%}.rrail::after{bottom:0;height:50%}
.rlist li:first-child .rrail::before,.rlist li:last-child .rrail::after{display:none}
.rpip{width:10px;height:10px;border-radius:50%;background:#fff;border:2.4px solid #C6D0E0;position:relative;z-index:2}
.rlist li.you .rpip{width:14px;height:14px;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,99,240,.15)}
.rnm{font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.rlist li.done .rnm{color:#9AA6BC;font-weight:400}
.rlist li.you .rnm{font-weight:700;color:var(--navy)}
.rsub{display:block;font-size:10.5px;font-weight:600;color:var(--blue);margin-top:1px}
.rlist li.done .rsub{color:#9AA6BC;font-weight:500}
.rt{font-size:14.5px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.rlist li.done .rt{color:#9AA6BC;font-weight:500}
.rbus{position:absolute;z-index:4;width:24px;height:24px;border-radius:50%;background:var(--blue);
 display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,99,240,.45);transform:translate(-50%,-50%);
 transition:top .4s linear;pointer-events:none}
.rbus svg{width:14px;height:14px;color:#fff}
.ridenote{font-size:11.5px;color:var(--muted);text-align:center;padding:12px 0 4px}
.perf{position:relative;height:20px;background:#fff;margin-top:2px}
.perf::before,.perf::after{content:"";position:absolute;top:50%;transform:translateY(-50%);
 width:22px;height:22px;border-radius:50%;background:var(--card)}
.perf::before{left:-11px}.perf::after{right:-11px}
.perf i{position:absolute;left:20px;right:20px;top:50%;height:7px;transform:translateY(-50%);
 background-image:radial-gradient(circle,#C9D3E2 3.2px,transparent 3.3px);
 background-size:22px 7px;background-position:center;background-repeat:repeat-x}
.tk__qr{padding:0 18px 14px;text-align:center;background:#fff}
.qrno{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qrno b{color:var(--blue);font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;margin-left:6px;
 text-transform:none;font-size:14px}
#qr{margin:8px auto 0;width:min(210px,58vw);aspect-ratio:1/1;display:grid;place-items:center;
 border:1px solid var(--line);border-radius:14px;padding:9px;background:#fff}
#qr img,#qr canvas,#qr table{width:100%;height:100%;image-rendering:pixelated}
.qrhint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}
.rot{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:10.5px;font-weight:600;color:var(--dim)}
.rot .d{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
/* prsten odbrojavanja — brojčanik s crticama */
.ring{position:relative;width:min(212px,56vw);aspect-ratio:1/1;margin:2px auto 0}
.ring svg{width:100%;height:100%;display:block}
.ring .track{fill:none;stroke:#E9EDF4;stroke-width:9}
.ring .prog{fill:none;stroke:url(#rgrad);stroke-width:9;stroke-linecap:round;
 transition:stroke-dashoffset .9s linear}
.ring.warn .prog{stroke:url(#wgrad)}
.ring.over .prog{stroke:#C2410C}
.ring .tick{stroke:#BFD3EA;stroke-width:1.6;stroke-linecap:round}
.ring .tick.on{stroke:#7FB0E0}
.ring__in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring__l{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4A6180}
.ring__v{font-size:clamp(42px,12vw,54px);font-weight:800;color:var(--navy);letter-spacing:-.04em;
 line-height:.95;margin-top:3px;font-variant-numeric:tabular-nums}
.ring__u{font-size:16px;font-weight:700;color:var(--navy);margin-top:0;letter-spacing:-.01em}
.badge-on{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:var(--green-bg);color:var(--green);
 border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.badge-on .d{width:7px;height:7px;border-radius:50%;background:#16A34A;animation:pl 2s ease-in-out infinite}
.badge-exp{background:#FDECE4;color:#8A3B1C}
.badge-exp .d{background:#C2410C;animation:none}
.demoBtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:25;
 border:0;background:#B23A00;color:#fff;border-radius:999px;padding:11px 16px;
 font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
 box-shadow:0 5px 18px rgba(178,58,0,.42);display:flex;align-items:center;gap:7px;max-width:calc(100vw - 24px)}
.demoBtn:active{background:#8A2D00;transform:translateY(1px)}
.demoBtn svg{width:14px;height:14px;flex:none}
.demoBtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:520px){.demoBtn{right:calc(50% - 215px + 12px)}}
.flash{position:fixed;inset:0;z-index:40;background:rgba(18,105,58,.96);color:#fff;display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.flash.on{display:flex;animation:fin .28s ease-out}
@keyframes fin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.flash svg{width:78px;height:78px}
.flash b{font-size:25px;font-weight:800;letter-spacing:-.02em}
.flash p{font-size:15px;opacity:.9}
.expnote{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45;text-align:center}
.locked{padding:26px 10px 8px;text-align:center}
.locked svg{width:34px;height:34px;color:var(--amber)}
.locked b{display:block;font-size:16px;font-weight:700;color:var(--navy);margin-top:11px}
.locked p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.locked .btn{margin-top:14px}
.warnnote{display:block;font-size:11.5px;color:var(--amber);margin-top:8px}
.bound{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;
 font-size:10.5px;font-weight:600;color:var(--green)}
.bound svg{width:11px;height:11px}
.savenote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}

@media (max-height:720px){
  .tk__nm{font-size:19px}
  .tk__top{padding:11px 18px 4px}
  .ring{width:min(182px,50vw)}
  .ring__v{font-size:clamp(36px,11vw,46px)}
  .ring__u{font-size:14px}
  .facts{margin-top:11px}
  .fact__v{font-size:19px;margin-top:4px}
  .segs{margin:7px 16px 2px}
  .segs button{padding:9px 6px;font-size:14px}
  .perf{height:16px}
  #qr{width:min(180px,50vw);margin-top:6px;padding:8px}
  .qrhint{font-size:11.5px;margin-top:6px}
}
@media (max-height:620px){
  .ring{width:min(158px,44vw)}
  .ring__v{font-size:34px}
  #qr{width:min(158px,44vw)}
  .qrhint,.rot,.bound{font-size:10px}
}
.savebtn{margin-top:12px}
.buildtag{margin-top:14px;text-align:center;font-size:10px;color:var(--dim);
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#0A2342;color:#fff;
 border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

</div>

  <b data-i18n="tkt.validated"></b>
  <p data-i18n="tkt.validatedSub"></p>
</div>

function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};

   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}

 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}

/* ---------- KLJUC UREDAJA ------------------------------------------------
   Kljuc se izdaje pri kupnji i ostaje SAMO u ovom pregledniku.
   QR se potpisuje kljucem, pa poveznica bez kljuca ne daje valjani kod.
   U produkciji: kljuc dolazi sa servera, potpis je HMAC-SHA256.        */
function deviceKey(){
  try{
    let k=localStorage.getItem('devKey');
    if(!k){ k=[...crypto.getRandomValues(new Uint8Array(16))]
      .map(b=>b.toString(16).padStart(2,'0')).join(''); localStorage.setItem('devKey',k); }
    return k;
  }catch(e){ return null; }
}
function keyFor(no){ try{ return JSON.parse(localStorage.getItem('ticketKeys')||'{}')[no]||null; }catch(e){ return null; } }
function bindKey(no){ try{ const m=JSON.parse(localStorage.getItem('ticketKeys')||'{}');
  m[no]=deviceKey(); localStorage.setItem('ticketKeys',JSON.stringify(m)); }catch(e){} }
function hasKey(no){ const k=keyFor(no); return !!k && k===deviceKey(); }

        '</svg>'+
        '<div class="ring__in"><div class="ring__l">'+t(over?'tkt.expired':'tkt.remaining',CUR)+'</div>'+
          (over?'':'<div class="ring__v">'+shown+'</div><div class="ring__u">'+t('tkt.min',CUR)+'</div>')+
        '</div></div>'+
      (over?'<div class="badge-on badge-exp"><span class="d"></span>'+t('tkt.expired',CUR)+'</div>'+
            '<p class="expnote">'+t('tkt.expiredNote',CUR)+'</p>':'');
    facts.innerHTML=
      '<div class="fact"><span class="fact__l">'+t('tkt.pax',CUR)+'</span>'+
        '<span class="fact__v">'+o.pax+'</span></div>'+
      '<div class="fact"><span class="fact__l">'+t('tkt.line',CUR)+' '+RIDE.line+'</span>'+
        '<span class="fact__v">'+RIDE.dest+'</span></div>';
    document.getElementById('segs').classList.toggle('on', !over);
    if(over) showTab('t');
    const sim=document.getElementById('simVal'); if(sim) sim.style.display=over?'none':'';
  }

  const BUSICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2.6"/><path d="M4 10.5h16M7.5 20v-2M16.5 20v-2"/></svg>';
  function renderRide(){
    const box=document.getElementById('ride');
    const pos=ridePos(), i=Math.floor(pos);
    const yourIn=Math.max(0,Math.round((RIDE.yourStop-pos)*RIDE.secPerStop/60));
    let html='<div class="ridehd">'+
      '<span class="lbadge">'+RIDE.line+'</span>'+
      '<span class="ridehd__d">'+RIDE.dest+'</span>'+
      '<span class="ridehd__p"><span class="d"></span>'+t('tkt.onBoard',CUR)+'</span></div>'+
      '<ul class="rlist" id="rlist">';
    RIDE.stops.forEach((nm,idx)=>{
      const done=idx<=i;
      const you=idx===RIDE.yourStop;
      const eta=Math.max(0,Math.round((idx-pos)*RIDE.secPerStop/60));
      let sub='';
      if(you) sub='<span class="rsub">'+t('line.yourStop',CUR)+'</span>';
      else if(idx===i+1) sub='<span class="rsub">'+t('tkt.nextStop',CUR)+'</span>';
      else if(done) sub='<span class="rsub">'+t('tkt.passed',CUR)+'</span>';
      else if(idx===RIDE.stops.length-1) sub='<span class="rsub" style="color:var(--muted);font-weight:500">'+t('tkt.endStop',CUR)+'</span>';
      html+='<li class="'+(done?'done ':'')+(you?'you':'')+'">'+
        '<span class="rrail"><span class="rpip"></span></span>'+
        '<span><span class="rnm">'+nm+'</span>'+sub+'</span>'+
        '<span class="rt">'+(done?'—':(eta<1?'<1':eta)+' min')+'</span></li>';
    });
    html+='</ul><p class="ridenote">'+t('tkt.rideNote',CUR)+'</p>';
    box.innerHTML=html;
    placeRideBus();
  }
  function placeRideBus(){
    const ul=document.getElementById('rlist'); if(!ul) return;
    const rows=[...ul.querySelectorAll('li')]; if(!rows.length) return;
    let dot=ul.querySelector('.rbus');
    if(!dot){ dot=document.createElement('div'); dot.className='rbus'; dot.innerHTML=BUSICON; ul.appendChild(dot); }
    const pos=ridePos(), i=Math.min(rows.length-1,Math.floor(pos)), j=Math.min(rows.length-1,i+1);
    const f=Math.max(0,Math.min(1,pos-i));
    const uR=ul.getBoundingClientRect();
    const a=rows[i].querySelector('.rpip').getBoundingClientRect();
    const b=rows[j].querySelector('.rpip').getBoundingClientRect();
    dot.style.left=(a.left-uR.left+a.width/2)+'px';
    dot.style.top=((a.top+a.height/2-uR.top)+((b.top+b.height/2-uR.top)-(a.top+a.height/2-uR.top))*f)+'px';
  }
  function showTab(which){
    const isRide=(which==='r');
    document.getElementById('tabT').setAttribute('aria-selected',String(!isRide));
    document.getElementById('tabR').setAttribute('aria-selected',String(isRide));
    document.getElementById('ride').classList.toggle('on',isRide);
    document.getElementById('perf').style.display=isRide?'none':'';
    document.getElementById('qrBlock').style.display=isRide?'none':'';
    if(isRide) renderRide();
  }
  document.getElementById('tabT').onclick=()=>showTab('t');
  document.getElementById('tabR').onclick=()=>showTab('r');

  /* zvuk potvrde: dva kratka tona, bez vanjske datoteke */
  function beep(){
    try{
      const A=new (window.AudioContext||window.webkitAudioContext)();
      [[880,0],[1320,.12]].forEach(([f,d])=>{
        const o1=A.createOscillator(), g=A.createGain();
        o1.type='sine'; o1.frequency.value=f;
        g.gain.setValueAtTime(0.0001,A.currentTime+d);
        g.gain.exponentialRampToValueAtTime(0.28,A.currentTime+d+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+d+0.16);
        o1.connect(g); g.connect(A.destination);
        o1.start(A.currentTime+d); o1.stop(A.currentTime+d+0.2);
      });
    }catch(e){}
  }
  function validate(){
    if(o.activated) return;
    o.activated=Date.now(); orderSave(o);
    if(navigator.vibrate) navigator.vibrate([40,60,120]);
    beep();
    const f=document.getElementById('flash'); f.classList.add('on');
    setTimeout(()=>{ f.classList.remove('on'); renderState(); }, 1500);
  }
  const sv=document.getElementById('simVal'); if(sv) sv.onclick=validate;
  renderState();
  setInterval(()=>{ renderState();
    if(document.getElementById('ride').classList.contains('on')) renderRide(); }, 1000);
  /* Rotirajuci kod: potpisuje se KLJUCEM UREDAJA, koji nije u poveznici.
     Zato karta otvorena na tudem uredaju prikazuje podatke, ali ne i valjani kod.
     U produkciji: HMAC-SHA256 kljucem koji izda server.                     */
  function token(){
    const key=keyFor(o.no)||'';
    const win=Math.floor(Date.now()/5000);
    let h=0, s=key+'|'+o.ticket+'|'+win+'|'+o.pax;
    for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
    return 'LIB1|'+o.ticket+'|'+win+'|'+h.toString(36).toUpperCase();
  }
  let timer=null;
  function draw(){
    const q=qrcode(0,'M'); q.addData(token()); q.make();
    document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
  }
  function showLocked(){
    document.getElementById('qrArea').innerHTML=
      '<div class="locked">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="10.5" width="14" height="10" rx="2.4"/><path d="M8.4 10.5V7.8a3.6 3.6 0 0 1 7.2 0v2.7"/></svg>'+
        '<b>'+t('key.locked',CUR)+'</b>'+
        '<p>'+t('key.lockedNote',CUR)+'</p>'+
        '<button class="btn" id="xfer" type="button">'+t('key.transfer',CUR)+'</button>'+
        '<span class="warnnote">'+t('key.transferWarn',CUR)+'</span>'+
      '</div>';
    document.getElementById('xfer').onclick=()=>{ bindKey(o.no); location.reload(); };
  }
  if(hasKey(o.no)){ draw(); timer=setInterval(draw,5000); }
  else showLocked();
  const save=document.getElementById('save');
  save.onclick=e=>{ e.preventDefault();
    const url=location.origin+location.pathname+'?no='+encodeURIComponent(o.no);
    const done=()=>{ const t=document.getElementById('toast'); t.classList.add('on');
      setTimeout(()=>t.classList.remove('on'),1800); };
    if(navigator.share){ navigator.share({title:'Liburnija',url:url}).then(done).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done).catch(()=>{}); }
    else done();
  };
  /* ekran ostaje upaljen dok je karta otvorena */
  if('wakeLock' in navigator){ navigator.wakeLock.request('screen').catch(()=>{}); }
}

</script>

<script>console.log("Liburnija · build 2026-07-27.5 · "+location.pathname.split("/").pop());</script>
