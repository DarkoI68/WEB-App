<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Plaćanje · DEMO</title>
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 9px) 14px 10px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--navy)}
.wrap{flex:1 1 auto;padding:14px 14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.foot{flex:none;position:sticky;bottom:0;background:rgba(249,249,251,.97);border-top:1px solid var(--line);
 padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:15px 14px;
 font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center;
 text-decoration:none;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.btn:active{background:var(--blue-dark);transform:translateY(1px)}
.btn[disabled],.btn.off{background:#DDE3EC;color:#9AA6BC;box-shadow:none;pointer-events:none}
.btn2{display:block;width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);
 padding:13px;font-family:var(--font);font-size:15px;font-weight:600;text-align:center;text-decoration:none}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

body{background:#EEF1F6}
.demobar{flex:none;background:#B23A00;color:#fff;text-align:center;padding:9px 14px;
 font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.paywrap{flex:1;padding:16px 14px}
.paycard{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(10,35,66,.10)}
.brand{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;
 border-bottom:1px solid var(--line)}
.brand__n{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:.02em}
.brand__s{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.amt{text-align:center;padding:18px 0 4px}
.amt__l{font-size:12px;color:var(--muted)}
.amt__v{font-size:34px;font-weight:800;color:var(--navy);letter-spacing:-.025em;margin-top:2px;
 font-variant-numeric:tabular-nums}
.amt__o{font-size:11.5px;color:var(--dim);margin-top:4px;font-family:ui-monospace,Menlo,monospace}
.pm{display:block;width:100%;border:0;border-radius:13px;padding:15px;margin-top:10px;
 font-family:var(--font);font-size:16px;font-weight:700;text-align:center}
.pm--apple{background:#000;color:#fff}
.pm--google{background:#fff;color:#3C4043;border:1px solid #DADCE0}
.pm--card{background:var(--blue);color:#fff}
.sim{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.sim__t{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
 text-align:center;margin-bottom:9px}
.sim button{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;
 padding:11px;font-family:var(--font);font-size:13.5px;font-weight:600;color:#8A3B1C;margin-bottom:7px}
.busy{position:fixed;inset:0;z-index:20;background:rgba(255,255,255,.94);display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:14px}
.busy.on{display:flex}
.spin{width:34px;height:34px;border:3px solid #DDE3EC;border-top-color:var(--blue);border-radius:50%;
 animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy p{font-size:14.5px;color:var(--muted)}
.err{display:none;background:#FDECE4;border:1px solid #F3C7B2;color:#8A3B1C;border-radius:11px;
 padding:11px 12px;font-size:13.5px;margin-bottom:12px}
.err.on{display:block}
</style>
</head>
<body>

<div class="demobar" data-i18n="pay.demo"></div>
<div class="paywrap">
  <div class="err" id="err" data-i18n="pay.failed"></div>
  <div class="paycard">
    <div class="brand"><span class="brand__n">Worldline · Saferpay</span><span class="brand__s">DEMO</span></div>
    <div class="amt">
      <div class="amt__l" data-i18n="pay.amount"></div>
      <div class="amt__v" id="amt">—</div>
      <div class="amt__o" id="ono">—</div>
    </div>
    <button class="pm pm--apple" data-m="apple" type="button"> Pay</button>
    <button class="pm pm--google" data-m="google" type="button">G Pay</button>
    <button class="pm pm--card" data-m="card" type="button" data-i18n="pay.card"></button>
    <div class="sim">
      <div class="sim__t">DEMO</div>
      <button id="simFail" type="button" data-i18n="pay.fail"></button>
      <button id="simAbort" type="button" data-i18n="pay.abort"></button>
    </div>
  </div>
</div>
<div class="busy" id="busy"><div class="spin"></div><p data-i18n="pay.processing"></p></div>

const PSEUDO=new URLSearchParams(location.search).has('pseudo');
function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}
let CUR=(document.cookie.match(/(?:^|; )lang=([a-z]{2})/)||[])[1]||detectLang();
function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}
function applyI18n(){document.documentElement.lang=CUR;
 const b=document.getElementById('langCode'); if(b) b.textContent=CUR.toUpperCase();
 document.querySelectorAll('[data-i18n]').forEach(e=>{
   let s=t(e.dataset.i18n,CUR);
   if(e.dataset.price) s=s.replace('{price}',e.dataset.price);
   e.textContent=s;});}

const PRICE=1.5;
/* ---------- KLJUC UREDAJA ------------------------------------------------
   Kljuc se izdaje pri kupnji i ostaje SAMO u ovom pregledniku.
   QR se potpisuje kljucem, pa poveznica bez kljuca ne daje valjani kod.
   U produkciji: kljuc dolazi sa servera, potpis je HMAC-SHA256.        */
function deviceKey(){
  try{
    let k=localStorage.getItem('devKey');
    if(!k){ k=[...crypto.getRandomValues(new Uint8Array(16))]
      .map(b=>b.toString(16).padStart(2,'0')).join(''); localStorage.setItem('devKey',k); }
    return k;
  }catch(e){ return null; }
}
function keyFor(no){ try{ return JSON.parse(localStorage.getItem('ticketKeys')||'{}')[no]||null; }catch(e){ return null; } }
function bindKey(no){ try{ const m=JSON.parse(localStorage.getItem('ticketKeys')||'{}');
  m[no]=deviceKey(); localStorage.setItem('ticketKeys',JSON.stringify(m)); }catch(e){} }
function hasKey(no){ const k=keyFor(no); return !!k && k===deviceKey(); }

const TYPES={
  single:{price:1.5, perPax:true,  auth:false, k:'tt.single', s:'tt.singleSub'},
  day:   {price:4.0, perPax:true,  auth:false, k:'tt.day',    s:'tt.daySub'},
  three: {price:10.0,perPax:true,  auth:true,  k:'tt.three',  s:'tt.threeSub'},
  week:  {price:20.0,perPax:true,  auth:true,  k:'tt.week',   s:'tt.weekSub'}
};
function account(){ try{ return localStorage.getItem('account')||null; }catch(e){ return null; } }
function eur(n){ return n.toFixed(2).replace('.',',')+' €'; }
function orderStore(){ try{ return JSON.parse(localStorage.getItem('orders')||'{}'); }catch(e){ return {}; } }
function orderSave(o){ try{ const s=orderStore(); s[o.no]=o; localStorage.setItem('orders',JSON.stringify(s));
  localStorage.setItem('lastOrder',o.no);}catch(e){} }
function orderGet(no){ return orderStore()[no]||null; }
function mkOrderNo(){ const d=new Date();
  return 'ZD-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+
    String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function mkTicketNo(){ const p=()=>Math.random().toString(36).slice(2,6).toUpperCase();
  return p()+'-'+p()+'-'+p(); }

const no=new URLSearchParams(location.search).get('no');
const o=orderGet(no);
if(!o) location.replace('./kupi.html');
else { document.getElementById('amt').textContent=eur(o.total);
       document.getElementById('ono').textContent=o.no; }
function pay(){
  document.getElementById('busy').classList.add('on');
  setTimeout(()=>{
    o.status='paid'; o.ticket=mkTicketNo(); o.paid=Date.now(); orderSave(o);
    bindKey(o.no);   /* kljuc ostaje u ovom pregledniku */
    location.href='./uspjeh.html?no='+encodeURIComponent(o.no);
  },1800);
}
document.querySelectorAll('.pm').forEach(b=>b.onclick=pay);
document.getElementById('simFail').onclick=()=>{
  document.getElementById('busy').classList.add('on');
  setTimeout(()=>{ document.getElementById('busy').classList.remove('on');
    document.getElementById('err').classList.add('on');
    window.scrollTo({top:0,behavior:'smooth'}); },1400);
};
document.getElementById('simAbort').onclick=()=>{
  /* placanje prolazi na serveru, ali se korisnik ne vraca na kartu */
  o.status='paid'; o.ticket=mkTicketNo(); o.paid=Date.now(); orderSave(o);
  bindKey(o.no);
  location.href='./prekid.html';
};
applyI18n();
