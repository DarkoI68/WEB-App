<title>Skeniraj · Liburnija d.o.o.</title>
<style>
:root{--blue:#0063F0;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;--amber:#B26B00;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{height:100%}
body{background:#0A1424;color:#fff;font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;display:flex;align-items:center;gap:11px}
.back{border:0;background:rgba(255,255,255,.14);border-radius:999px;width:34px;height:34px;display:grid;
 place-items:center;flex:none;color:#fff;text-decoration:none}
.back svg{width:16px;height:16px}
.top h1{flex:1;font-size:18px;font-weight:700;letter-spacing:-.02em}
.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0A1424}
.mask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.frame{width:min(240px,62vw);aspect-ratio:1/1;position:relative}
.frame i{position:absolute;width:34px;height:34px;border:3.5px solid #fff;border-radius:6px}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.frame.hit i{border-color:#3BD37A}
.hint{position:absolute;left:16px;right:16px;bottom:18px;text-align:center;font-size:13.5px;
 color:rgba(255,255,255,.9);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.state{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
 gap:12px;padding:26px 22px;text-align:center;background:#0A1424}
.state.on{display:flex}
.state svg{width:44px;height:44px;color:#7D8CA6}
.state b{font-size:18px;font-weight:700}
.state p{font-size:13.5px;color:#9DA9BD;line-height:1.5;max-width:290px}
.state a,.state button{margin-top:6px;border:0;background:var(--blue);color:#fff;border-radius:12px;
 padding:12px 20px;font-family:var(--font);font-size:15px;font-weight:700;text-decoration:none}
.demo{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;border:0;
 background:#B23A00;color:#fff;border-radius:999px;padding:11px 15px;font-family:var(--font);font-size:11.5px;
 font-weight:800;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 18px rgba(178,58,0,.45)}
nav.tabs{flex:none;display:flex;background:#0F1B2E;border-top:1px solid rgba(255,255,255,.09);
 padding:7px 0 calc(env(safe-area-inset-bottom) + 5px)}
nav.tabs a{flex:1;min-width:0;text-decoration:none;color:#7D8CA6;display:flex;flex-direction:column;
 align-items:center;gap:3px;font-size:9.5px;font-weight:600;line-height:1.1;text-align:center;padding:0 1px}
nav.tabs a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs a[aria-current]{color:#5FA8FF}
nav.tabs svg{width:20px;height:20px}
@media (min-width:520px){body{max-width:430px;margin:0 auto}}

/* srednji tab: istaknuto narancasto dugme za skeniranje */
nav.tabs{overflow:visible;position:relative;z-index:30}
nav.tabs a.scan{position:relative}
nav.tabs a.scan .fab{position:absolute;top:0;left:50%;transform:translate(-50%,-27px);
 width:58px;height:58px;border-radius:50%;background:#DA5D23;
 display:grid;place-items:center;box-shadow:0 6px 18px rgba(218,93,35,.45);
 border:4px solid #0F1B2E}
nav.tabs a.scan .fab svg{width:26px;height:26px;color:#fff;stroke:#fff}
nav.tabs a.scan span[data-i18n]{margin-top:36px}
nav.tabs a.scan[aria-current]{color:#BE4C1B}
nav.tabs a.scan[aria-current] .fab{background:#BE4C1B}
nav.tabs a.scan:active .fab{background:#A8420F;transform:translate(-50%,-25px)}
</style>

function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}

function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}

const v=document.getElementById('cam'), cv=document.getElementById('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
const frame=document.getElementById('frame'), hint=document.getElementById('hint');
let stream=null, raf=null, done=false;

function goBus(p){
  if(done) return; done=true;
  frame.classList.add('hit');
  hint.textContent=t('scan.found',CUR)+': '+t('exp.line',CUR)
    .replace('{l}',p.get('bus')).replace('{d}',p.get('dest')||'');
  if(navigator.vibrate) navigator.vibrate(60);
  setTimeout(()=>{ if(stream) stream.getTracks().forEach(t=>t.stop());
    location.href='./ekspres.html?bus='+encodeURIComponent(p.get('bus'))+
      '&veh='+encodeURIComponent(p.get('veh')||'')+
      '&dest='+encodeURIComponent(p.get('dest')||''); },600);
}
function go(stop){
  if(done) return; done=true;
  frame.classList.add('hit');
  hint.textContent=t('scan.found',CUR)+(stop?': '+stop:'');
  if(navigator.vibrate) navigator.vibrate(60);
  stop && localStorage.setItem('lastStop',stop);
  setTimeout(()=>{ if(stream) stream.getTracks().forEach(t=>t.stop());
    location.href='./index.html'+(stop?'?stop='+encodeURIComponent(stop):''); },600);
}
function tick(){
  if(done) return;
  if(v.readyState===v.HAVE_ENOUGH_DATA && typeof jsQR!=='undefined'){
    cv.width=v.videoWidth; cv.height=v.videoHeight;
    ctx.drawImage(v,0,0,cv.width,cv.height);
    const img=ctx.getImageData(0,0,cv.width,cv.height);
    const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(code && code.data){
      /* Naljepnica u autobusu nosi bus=, oznaka stanice nosi stop= */
      let p=null;
      try{ p=new URL(code.data,location.href).searchParams; }catch(e){}
      if(p && p.get('bus')){ goBus(p); return; }
      go((p&&p.get('stop'))||code.data.slice(0,40));
      return;
    }
  }
  raf=requestAnimationFrame(tick);
}
async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=stream; await v.play(); tick();
  }catch(e){
    document.getElementById('denied').classList.add('on');
  }
}
