<title>Transakcije · Liburnija d.o.o.</title>
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --amber:#B26B00;--amber-bg:#FFF6E3;--card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 10px) 14px 11px}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.024em;color:var(--navy)}
.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 14px}
.hd{padding:12px 2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--muted)}
.hd:first-child{padding-top:2px}
.empty{padding:44px 18px;text-align:center}
.empty svg{width:44px;height:44px;color:#C9D3E2}
.empty b{display:block;font-size:17px;font-weight:700;color:var(--navy);margin-top:13px}
.empty p{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.empty a{display:inline-block;margin-top:16px;background:var(--blue);color:#fff;border-radius:12px;
 padding:12px 20px;font-size:15px;font-weight:700;text-decoration:none}
nav.tabs{flex:none;display:flex;background:rgba(249,249,251,.95);border-top:1px solid var(--line);
 padding:7px 0 calc(env(safe-area-inset-bottom) + 5px);
 -webkit-backdrop-filter:saturate(1.7) blur(14px);backdrop-filter:saturate(1.7) blur(14px)}
nav.tabs a{flex:1;min-width:0;text-decoration:none;color:#98A4BB;display:flex;flex-direction:column;
 align-items:center;gap:3px;font-family:var(--font);font-size:9.5px;font-weight:600;line-height:1.1;
 text-align:center;padding:0 1px}
nav.tabs a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs a[aria-current]{color:var(--blue)}
nav.tabs svg{width:20px;height:20px}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

.tx{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px}
.tx__r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tx__nm{font-size:16.5px;font-weight:700;color:var(--navy);letter-spacing:-.018em}
.tx__amt{font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx__r2{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.pm{display:inline-flex;align-items:center;gap:6px;background:#F2F5FA;border-radius:8px;padding:5px 9px;
 font-size:12px;font-weight:600;color:#3C4E69}
.pm svg{width:14px;height:14px}
.tx__meta{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;
 font-variant-numeric:tabular-nums}
.tx__meta b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-weight:600}
.r1tag{background:#FFF6E3;color:var(--amber);border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700}
</style>
</head>
