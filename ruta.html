<head>

<style>
html,body{touch-action:manipulation}
body *{touch-action:manipulation}

:root{--blue:#0063F0;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --orange:#DA5D23;--purple:#6352C4;--amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:#fff;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
.top__r1{display:flex;align-items:center;gap:12px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.big{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.big__ic{width:26px;height:26px;color:var(--ink);flex:none}
.big__t{font-size:26px;font-weight:700;letter-spacing:-.03em}
.sub{font-size:13.5px;color:var(--muted);margin-top:3px;padding-left:46px}
.chips{display:flex;align-items:center;gap:6px;margin-top:9px;padding-left:46px;flex-wrap:wrap}
.leg-bus{min-width:30px;height:23px;border-radius:6px;color:#fff;padding:0 7px;font-size:12.5px;font-weight:700;
 line-height:23px;text-align:center}
.l1{background:var(--orange)}.l2{background:var(--blue)}.l3{background:var(--purple)}
.l4{background:#0F7B6C}.l5{background:#B8437E}.l6{background:#3D6BB3}
.leg-walk{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:#5B6B85}
.leg-walk svg{width:15px;height:15px}
.arrow{color:#C9D1DE;font-size:12px}
.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px}
/* traka putovanja, kao u Mapama */
.step{display:grid;grid-template-columns:34px 1fr auto;column-gap:12px;padding:0 16px;position:relative}
.step__rail{position:relative;display:flex;justify-content:center}
.step__rail::before{content:"";position:absolute;top:0;bottom:0;width:7px;border-radius:4px;background:transparent}
.step.ride .step__rail::before{background:var(--railc,#0063F0);top:23px}
.step.walkleg .step__rail::before{width:7px;border-left:0;background:none;
 background-image:radial-gradient(circle,#C6D0E0 2.2px,transparent 2.3px);
 background-size:7px 11px;background-position:center top;background-repeat:repeat-y}
.node{position:relative;z-index:2;margin-top:13px}
.node.pin{width:19px;height:19px;color:#C2410C;margin-top:11px}
.node.dot{width:15px;height:15px;border-radius:50%;background:#fff;border:4px solid var(--railc,#0063F0)}
.node.small{display:none}
.step__b{padding:9px 0 16px;min-width:0}
.ttl{display:block;font-size:16.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.ttl{display:block}
.addr{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.time{font-size:14px;color:var(--muted);padding-top:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.time b{color:var(--ink);font-weight:600}
.walk{display:flex;align-items:center;gap:8px;font-size:15px;color:#3C4E69;padding:11px 0 4px}
.walk svg{width:18px;height:18px;color:#5B6B85;flex:none}
.navlink{display:inline-flex;align-items:center;gap:6px;margin:0 0 15px 26px;color:var(--blue);
 text-decoration:none;font-size:13.5px;font-weight:600}
.navlink svg{width:14px;height:14px}
.linebox{margin-top:2px;display:flex;align-items:center;gap:9px}
.linebox__d{font-size:15px;font-weight:600;color:var(--ink)}
.dep{margin-left:auto;font-size:14px;font-weight:700;color:var(--green)}
.dep.soon{color:var(--orange)}
.alsoin{font-size:13px;color:var(--muted);margin-top:7px}
.alsoin b{color:var(--green);font-weight:600}
.toggle{display:flex;align-items:center;gap:7px;border:0;background:none;padding:11px 0 4px;
 font-family:var(--font);font-size:14.5px;font-weight:500;color:var(--ink)}
.toggle svg{width:13px;height:13px;color:var(--muted);transition:transform .2s}
.toggle.open svg{transform:rotate(180deg)}
.mid{list-style:none;margin:0 0 6px;padding:0}
.mid li{display:grid;grid-template-columns:1fr auto;align-items:center;padding:6px 0;font-size:14.5px;color:#3C4E69}
.mid li span:last-child{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.xfer{display:grid;grid-template-columns:34px 1fr auto;column-gap:12px;padding:0 16px}
.xfer__rail{position:relative;display:flex;justify-content:center}
.xfer__rail::before{content:"";position:absolute;top:0;bottom:0;width:7px;
 background-image:radial-gradient(circle,#C6D0E0 2.2px,transparent 2.3px);
 background-size:7px 11px;background-position:center top;background-repeat:repeat-y}
.xfer__b{padding:9px 0 14px}
.xfer__t{display:inline-flex;align-items:center;gap:7px;background:var(--amber-bg);color:#5C3B00;
 border:1px solid var(--amber-line);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
.xfer__t svg{width:15px;height:15px;flex:none}
.foot{flex:none;padding:11px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);
 background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cost{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;font-size:13.5px;color:var(--muted)}
.cost b{font-size:17px;color:var(--navy);font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:14px;
 font-family:var(--font);font-size:16.5px;font-weight:700;text-align:center;text-decoration:none;
 box-shadow:0 5px 16px rgba(0,99,240,.26)}
.demobar{flex:none;background:var(--amber-bg);border-bottom:1px solid var(--amber-line);color:#5C3B00;
 padding:7px 14px;font-size:11px;font-weight:700;text-align:center}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}
</style>
</head>

</div>

}
function midStops(){
  const i=STOPS.findIndex(s=>s[0]===r.sA.name), j=STOPS.findIndex(s=>s[0]===r.sB.name);
  const step=i<j?1:-1, out=[];
  for(let k=i+step;k!==j;k+=step){ if(k<0||k>=STOPS.length) break; out.push(STOPS[k][0]); }
  return out;
}
let OPEN=false;
function render(){
  q('bigT').textContent=r.total+' min';
  q('sub').textContent=t('plan.arriveAt',CUR).replace('{t}',hhmm(r.arr))+' · 1,50 €';
  q('chips').innerHTML='<span class="leg-walk">'+WALK+r.wA+'</span><span class="arrow">›</span>'+
    r.lines.map(l=>'<span class="leg-bus '+(LCLS[l]||'l2')+'">'+l+'</span>').join('<span class="arrow">›</span>')+
    '<span class="arrow">›</span><span class="leg-walk">'+WALK+r.wB+'</span>';

  const mids=midStops();
  const railc={l1:'#DA5D23',l2:'#0063F0',l3:'#6352C4',l4:'#0F7B6C',l5:'#B8437E',l6:'#3D6BB3'}[LCLS[r.lines[0]]]||'#0063F0';
  const dep=r.waitMin<=1? t('plan.now2',CUR) : t('plan.depIn',CUR).replace('{n}',r.waitMin);
  let h='';
  /* 1. polaziste */
  h+='<div class="step"><span class="step__rail"><svg class="node pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2Z"/></svg></span>'
    +'<span class="step__b"><span class="ttl">'+A.name+'</span><span class="addr">'+t('plan.start',CUR)+'</span></span>'
    +'<span class="time">'+hhmm(Date.now())+'</span></div>';
  /* 2. hodanje do stanice */
  h+=walkLeg(A, r.sA, r.wA, r.sA.d, 'plan.walkTo');
  /* 3. voznja (jedna ili dvije, ovisno o presjedanju) */
  const two = r.lines.length>1 && r.transferAt;
  const xi = two ? Math.max(1, mids.indexOf(r.transferAt)+1) : mids.length;
  const seg1 = two ? mids.slice(0, xi-1) : mids;
  const seg2 = two ? mids.slice(xi) : [];
  const xferName = two ? (mids[xi-1] || r.transferAt) : null;
  const t0 = new Date(r.dep).getTime();
  const per = 2*60000;

  function rideBlock(line, fromName, toName, stops, startMs, showAlso){
    const cls = LCLS[line]||'l2';
    const col = {l1:'#DA5D23',l2:'#0063F0',l3:'#6352C4',l4:'#0F7B6C',l5:'#B8437E',l6:'#3D6BB3'}[cls];
    const mins = (stops.length+1)*2;
    const dep = r.waitMin<=1? t('plan.now2',CUR) : t('plan.depIn',CUR).replace('{n}',r.waitMin);
    return '<div class="step ride" style="--railc:'+col+'"><span class="step__rail"><span class="node dot"></span></span>'
      +'<span class="step__b"><span class="ttl">'+fromName+'</span>'
      +'<span class="linebox"><span class="leg-bus '+cls+'">'+line+'</span>'
        +'<span class="linebox__d">'+toName+'</span>'
        +(showAlso?'<span class="dep'+(r.waitMin<=3?' soon':'')+'">'+dep+'</span>':'')+'</span>'
      +(showAlso?'<span class="alsoin">'+t('plan.alsoIn',CUR).replace('{a}','<b>'+(r.waitMin+12)+' min</b>').replace('{b}','<b>'+(r.waitMin+24)+' min</b>')+'</span>':'')
      +'<button class="toggle'+(OPEN?' open':'')+'" data-tg="1">'
        +t('plan.rideStops',CUR).replace('{n}',stops.length+1).replace('{m}',mins)+CHEV+'</button>'
      +(OPEN?'<ul class="mid">'+stops.map((m,i)=>'<li><span>'+m+'</span><span>'+hhmm(startMs+(i+1)*per)+'</span></li>').join('')+'</ul>':'')
      +'</span><span class="time"><b>'+hhmm(startMs)+'</b></span></div>';
  }
  let endMs;
  if(!two){
    endMs = t0 + (seg1.length+1)*per;
    h+=rideBlock(r.lines[0], r.sA.name, r.sB.name, seg1, t0, true);
  } else {
    const xferMs = t0 + (seg1.length+1)*per;
    h+=rideBlock(r.lines[0], r.sA.name, xferName, seg1, t0, true);
    /* izlazak i presjedanje */
    h+='<div class="step" style="--railc:#C6D0E0"><span class="step__rail"><span class="node dot" style="border-color:#9AA6BC"></span></span>'
      +'<span class="step__b"><span class="ttl">'+xferName+'</span>'
      +'<span class="addr">'+t('plan.getOff',CUR)+'</span></span>'
      +'<span class="time"><b>'+hhmm(xferMs)+'</b></span></div>';
    h+='<div class="xfer"><span class="xfer__rail"></span>'
      +'<span class="xfer__b"><span class="xfer__t">'
        +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>'
        +t('plan.transferAt',CUR)+' · '+xferName+'</span></span><span></span></div>';
    const start2 = xferMs+3*60000;
    endMs = start2 + (seg2.length+1)*per;
    h+=rideBlock(r.lines[1], xferName, r.sB.name, seg2, start2, false);
  }
  /* 4. izlazak */
  h+='<div class="step" style="--railc:'+railc+'"><span class="step__rail"><span class="node dot"></span></span>'
    +'<span class="step__b"><span class="ttl">'+r.sB.name+'</span><span class="addr">'+t('plan.getOff',CUR)+'</span></span>'
    +'<span class="time"><b>'+hhmm(endMs)+'</b></span></div>';
  /* 5. hodanje do cilja */
  h+=walkLeg(r.sB, B, r.wB, r.sB.d, 'plan.walkFrom');
  /* 6. odrediste */
  h+='<div class="step"><span class="step__rail"><svg class="node pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2Z"/></svg></span>'
    +'<span class="step__b"><span class="ttl">'+B.name+'</span><span class="addr">'+t('plan.end',CUR)+'</span></span>'
    +'<span class="time"><b>'+hhmm(endMs+r.wB*60000)+'</b></span></div>';
  q('wrap').innerHTML=h;
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{ OPEN=!OPEN; render(); });
}
applyI18n(); render();
}

</script>
