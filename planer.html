<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Planiraj put · Liburnija d.o.o.</title>
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --orange:#DA5D23;--purple:#6352C4;--amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 10px) 14px 11px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top h1{flex:1;font-size:21px;font-weight:700;letter-spacing:-.024em;color:var(--navy)}
.demobar{flex:none;background:var(--amber-bg);border-bottom:1px solid var(--amber-line);color:#5C3B00;
 padding:8px 14px;font-size:11.5px;font-weight:700;text-align:center;letter-spacing:.02em}
.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px 14px 14px}
/* polja */
.fields{background:#fff;border:1px solid var(--line);border-radius:15px;padding:4px 12px;position:relative}
.fld{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:11px;padding:12px 0;
 border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld__i{width:22px;display:grid;place-items:center}
.dotA{width:11px;height:11px;border-radius:50%;border:3px solid var(--blue);background:#fff}
.dotB{width:13px;height:13px;color:var(--navy)}
.fld__t{min-width:0}
.fld__l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld__v{font-size:16.5px;font-weight:600;color:var(--navy);margin-top:1px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld__v.ph{color:var(--dim);font-weight:500}
.swap{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);
 background:#fff;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;color:var(--blue);
 box-shadow:0 2px 8px rgba(0,41,116,.1)}
.swap svg{width:17px;height:17px}
/* vrijeme */
.timerow{display:flex;gap:7px;margin-top:11px}
.timerow button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 6px;
 font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--muted)}
.timerow button[aria-pressed="true"]{border-color:var(--blue);background:#F2F7FF;color:var(--navy)}
.go{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;background:var(--blue);color:#fff;
 padding:15px;font-family:var(--font);font-size:17px;font-weight:700;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.go[disabled]{background:#DDE3EC;color:#9AA6BC;box-shadow:none}
.hd{padding:16px 2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--muted)}
.pop{display:flex;flex-wrap:wrap;gap:7px}
.pop button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;
 font-family:var(--font);font-size:14px;font-weight:600;color:var(--navy)}
/* rute */
.route{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;
 text-decoration:none;color:inherit;display:block}
.route:active{background:#F4F7FC}
.route__r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.route__t{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.route__t small{font-size:14px;font-weight:700;margin-left:2px}
.route__w{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 border-radius:6px;padding:3px 7px;margin-bottom:8px}
.tag-fast{background:var(--green-bg);color:var(--green)}
.tag-walk{background:#EEF3FC;color:#2B5AA8}
.legs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px}
.leg-walk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.leg-walk svg{width:14px;height:14px}
.leg-bus{min-width:32px;height:24px;border-radius:7px;color:#fff;padding:0 7px;font-size:12.5px;font-weight:700;
 line-height:24px;text-align:center}
.l1{background:var(--orange)}.l2{background:var(--blue)}.l3{background:var(--purple)}
.l4{background:#0F7B6C}.l5{background:#B8437E}.l6{background:#3D6BB3}
.arrow{color:#C9D1DE;font-size:13px}
.route__meta{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
 display:flex;justify-content:space-between;gap:10px}
.route__meta b{color:var(--navy);font-weight:600}
/* biraè */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,35,66,.42);opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;max-height:84dvh;
 display:flex;flex-direction:column;transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sh.on{transform:translateY(0)}
.sh__grab{width:38px;height:4px;border-radius:99px;background:#D3DAE7;margin:9px auto 0;flex:none}
.sh__hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px 9px;flex:none}
.sh__hd h3{font-size:17px;font-weight:700;color:var(--navy)}
.sh__x{border:0;background:#F1F4FA;border-radius:999px;padding:7px 12px;font-family:var(--font);font-size:12.5px;
 font-weight:600;color:var(--navy)}
.sh__q{margin:0 14px 8px;position:relative;display:flex;align-items:center;flex:none}
.sh__q svg{position:absolute;left:11px;width:16px;height:16px;color:var(--dim)}
.sh__q input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;
 padding:11px 12px 11px 34px;font-family:var(--font);font-size:15px}
.sh__q input:focus{outline:none;border-color:var(--blue);background:#fff}
.slist{list-style:none;margin:0;padding:0 0 calc(env(safe-area-inset-bottom) + 10px);overflow-y:auto}
.slist button{width:100%;border:0;background:none;text-align:left;padding:13px 18px;font-family:var(--font);
 font-size:16px;font-weight:500;color:var(--ink);border-bottom:1px solid #EEF1F7}
.slist button:active{background:#F4F7FC}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}
 .scrim,.sh{max-width:430px;margin:0 auto}}
</style>
</head>

<div class="top">
  <a class="back" href="./index.html" aria-label="Natrag"><svg viewBox="0 0 16 16" fill="none"><path d="M10 2 4 8l6 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1 data-i18n="plan.title"></h1>
</div>
<div class="demobar" data-i18n="plan.mock"></div>
<div class="wrap">
  <div class="fields">
    <button class="fld" id="fldA" type="button" style="width:100%;border:0;background:none;text-align:left">
      <span class="fld__i"><span class="dotA"></span></span>
      <span class="fld__t"><span class="fld__l" data-i18n="plan.from"></span>
        <span class="fld__v ph" id="valA"></span></span>
    </button>
    <button class="fld" id="fldB" type="button" style="width:100%;border:0;background:none;text-align:left">
      <span class="fld__i"><svg class="dotB" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2Z"/></svg></span>
      <span class="fld__t"><span class="fld__l" data-i18n="plan.to"></span>
        <span class="fld__v ph" id="valB"></span></span>
    </button>
    <button class="swap" id="swap" type="button" aria-label="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13M7 4 4 7M7 4l3 3M17 20V7M17 20l3-3M17 20l-3-3"/></svg></button>
  </div>
  <div class="timerow">
    <button id="tNow" type="button" aria-pressed="true" data-i18n="plan.now"></button>
    <button id="tDep" type="button" aria-pressed="false" data-i18n="plan.depart"></button>
    <button id="tArr" type="button" aria-pressed="false" data-i18n="plan.arrive"></button>
  </div>
  <button class="go" id="go" type="button" disabled data-i18n="plan.search"></button>

  <div id="popWrap">
    <div class="hd" data-i18n="plan.popular"></div>
    <div class="pop" id="pop"></div>
  </div>
  <div id="res"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sh" id="sh" role="dialog" aria-modal="true">
  <div class="sh__grab"></div>
  <div class="sh__hd"><h3 id="shTitle"></h3><button class="sh__x" id="shX" type="button" data-i18n="lang.close"></button></div>
  <div class="sh__q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6.6"/><path d="m15.6 15.6 4 4"/></svg>
    <input id="shQ" type="search" autocomplete="off">
  </div>
  <ul class="slist" id="shList"></ul>
</div>

const PSEUDO=new URLSearchParams(location.search).has('pseudo');
function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}
let CUR=(document.cookie.match(/(?:^|; )lang=([a-z]{2})/)||[])[1]||detectLang();
function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}
function applyI18n(){document.documentElement.lang=CUR;

 document.querySelectorAll('[data-i18n]').forEach(e=>{
   let s=t(e.dataset.i18n,CUR);
   if(e.dataset.price) s=s.replace('{price}',e.dataset.price);
   e.textContent=s;});}

const LCLS={'1B':'l1','2':'l2','5A':'l3','8A':'l4','4':'l5','7':'l6'};
let A=null, B=null, WHICH=null, MODE='now';
const q=id=>document.getElementById(id);
function norm(s){return s.toLowerCase().replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').replace(/đ/g,'d');}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

function paint(){
  q('valA').textContent = A || t('plan.fromPh',CUR);
  q('valA').classList.toggle('ph', !A);
  q('valB').textContent = B || t('plan.toPh',CUR);
  q('valB').classList.toggle('ph', !B);
  q('go').disabled = !(A && B && A!==B);
}
function openPicker(which){
  WHICH=which;
  q('shTitle').textContent = t(which==='a'?'plan.from':'plan.to',CUR);
  q('shQ').placeholder = t('stops.search',CUR);
  q('shQ').value=''; list('');
  q('scrim').classList.add('on'); q('sh').classList.add('on');
  setTimeout(()=>q('shQ').focus(),260);
}
function closePicker(){ q('scrim').classList.remove('on'); q('sh').classList.remove('on'); }
function list(f){
  const ul=q('shList'); ul.innerHTML='';
  const m=STOPS.filter(s=>!f || norm(s).indexOf(norm(f))>=0);
  if(!m.length){ ul.innerHTML='<li class="empty">'+t('stops.none',CUR)+'</li>'; return; }
  m.forEach(s=>{
    const li=document.createElement('li');
    const b=document.createElement('button'); b.type='button'; b.textContent=s;
    b.onclick=()=>{ if(WHICH==='a') A=s; else B=s; paint(); closePicker(); if(A&&B) search(); };
    li.appendChild(b); ul.appendChild(li);
  });
}
q('fldA').onclick=()=>openPicker('a');
q('fldB').onclick=()=>openPicker('b');
q('shX').onclick=closePicker; q('scrim').onclick=closePicker;
q('shQ').addEventListener('input',e=>list(e.target.value.trim()));
q('swap').onclick=()=>{ const x=A; A=B; B=x; paint(); if(A&&B) search(); };
['tNow','tDep','tArr'].forEach((id,i)=>{
  q(id).onclick=()=>{ MODE=['now','dep','arr'][i];
    ['tNow','tDep','tArr'].forEach((x,j)=>q(x).setAttribute('aria-pressed',String(i===j))); };
});

/* --- MAKETA: rute su izmisljene, izvedene iz razmaka stanica u popisu --- */
function mockRoutes(){
  const ia=STOPS.indexOf(A), ib=STOPS.indexOf(B);
  const d=Math.abs(ib-ia);
  const now=new Date();
  const r1={walkA:3, ride:Math.max(4,d*2), walkB:2, lines:[['2',null]], transfer:false};
  const r2={walkA:6, ride:Math.max(6,Math.round(d*1.6)), walkB:4,
            lines:[['1B',null],['5A',null]], transfer:true};
  [r1,r2].forEach(r=>{
    r.total=r.walkA+r.ride+r.walkB;
    r.dep=new Date(now.getTime()+r.walkA*60000+2*60000);
    r.arr=new Date(r.dep.getTime()+(r.ride+r.walkB)*60000);
  });
  r1.tag='fast';
  r2.tag = (r2.walkA+r2.walkB) < (r1.walkA+r1.walkB) ? 'walk' : null;
  return [r1,r2].sort((a,b)=>a.total-b.total);
}
const WALKICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.8"/><path d="M11 21l1.6-5.4-2.6-2.2.9-4.4 3.6 1.8 2.2 2.6M9.4 12.6 7 15M13.4 15.6 15 21"/></svg>';
function routeCard(r){
  const legs = '<span class="leg-walk">'+WALKICON+r.walkA+'</span><span class="arrow">›</span>'+
    r.lines.map(l=>'<span class="leg-bus '+(LCLS[l[0]]||'l2')+'">'+l[0]+'</span>').join('<span class="arrow">›</span>')+
    '<span class="arrow">›</span><span class="leg-walk">'+WALKICON+r.walkB+'</span>';
  const tag = r.tag==='fast' ? '<span class="tag tag-fast">'+t('plan.fastest',CUR)+'</span>'
            : r.tag==='walk' ? '<span class="tag tag-walk">'+t('plan.fewest',CUR)+'</span>' : '';
  return '<a class="route" href="./linija.html?state=live">'+tag+
    '<div class="route__r1"><span class="route__t">'+r.total+'<small> min</small></span>'+
      '<span class="route__w">'+(r.transfer? t('plan.transfer',CUR) : t('plan.direct',CUR))+'</span></div>'+
    '<div class="legs">'+legs+'</div>'+
    '<div class="route__meta"><span>'+t('plan.leaveAt',CUR).replace('{t}','<b>'+hhmm(r.dep)+'</b>')+'</span>'+
      '<span>'+t('plan.arriveAt',CUR).replace('{t}','<b>'+hhmm(r.arr)+'</b>')+'</span></div></a>';
}
function search(){
  if(!(A&&B&&A!==B)) return;
  q('popWrap').style.display='none';
  q('res').innerHTML='<div class="hd">'+t('plan.results',CUR)+'</div>'+mockRoutes().map(routeCard).join('');
}
q('go').onclick=search;

/* popularna odredista */
POPULAR.forEach(s=>{
  const b=document.createElement('button'); b.type='button'; b.textContent=s;
  b.onclick=()=>{ B=s; if(!A) A=localStorage.getItem('lastStop')||'Mala pošta'; paint(); search(); };
  q('pop').appendChild(b);
});
/* polaziste iz skeniranja, ako postoji */
const last=localStorage.getItem('lastStop'); if(last) A=last;

applyI18n(); paint();
