<!doctype html>
<html lang="hr"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0063F0">
<title>Linija 2 · Poluotok</title>
<link rel="stylesheet" href="./maplibre-gl.css">
<style>
html,body{touch-action:manipulation}
body *{touch-action:manipulation}
/* Zemljovid sam upravlja gestama — vracamo mu ih. */
.maplibregl-map,.maplibregl-map *{touch-action:none}

:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--orange:#DA5D23;--purple:#6352C4;
 --amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;--map:30dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* topbar */
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 9px) 14px 10px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--navy)}
.back svg{width:16px;height:16px}
.top__mid{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.lbadge{flex:none;min-width:36px;height:28px;border-radius:8px;background:var(--blue);color:#fff;
 font-family:var(--font);font-size:14px;font-weight:700;line-height:28px;text-align:center;padding:0 7px}
.top__txt{min-width:0}
.top__dir{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.top__dest{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--navy);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}

.livewave{width:13px;height:13px;flex:none;color:#12693A;margin-right:4px;vertical-align:-1px;
 animation:livepulse 1.8s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.livewave{animation:none}}
.statsub{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.statsub b{font-weight:700;color:var(--navy)}
.livepill{flex:none;display:flex;align-items:center;gap:5px;background:#E7F6EC;color:#12693A;
 border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:#16A34A;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

/* disruption */
.disr{flex:none;display:flex;gap:9px;align-items:flex-start;background:var(--amber-bg);
 border-bottom:1px solid var(--amber-line);padding:9px 14px;color:#5C3B00}
.disr svg{width:17px;height:17px;flex:none;color:var(--amber);margin-top:1px}
.disr b{display:block;font-size:12px;font-weight:700;letter-spacing:.01em}
.disr p{font-size:11.5px;line-height:1.35;margin-top:1px;color:#6E4E15}

/* map */
.mapwrap{flex:none;height:var(--map);position:relative;background:#DCEDF7;
 transition:height .28s cubic-bezier(.4,0,.2,1)}
body.mapfull .mapwrap{position:fixed;inset:0;height:100dvh;z-index:40;border-radius:0}
body.mapfull .top,body.mapfull .disr,body.mapfull .stops,body.mapfull .footwrap,body.mapfull .dbtn{display:none}
@media (min-width:520px){body.mapfull .mapwrap{left:0;right:0;width:100vw;transform:none}}
/* oznaka stanice */
.stopmk{width:max-content;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.stopmk__lab{background:#0063F0;color:#fff;border-radius:7px;padding:4px 8px 5px;white-space:nowrap;
 text-align:center;box-shadow:0 3px 10px rgba(0,41,116,.38);
 font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.stopmk__nm{font-size:11px;font-weight:700;line-height:1.15}
.stopmk__sb{font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.88;margin-top:1px}
.stopmk__tip{width:8px;height:8px;background:#0063F0;transform:rotate(45deg);margin-top:-4px;border-radius:1px}
.stopmk__pin{margin-top:2px}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important}
.mapbtn{position:absolute;right:10px;bottom:10px;z-index:3;border:0;background:rgba(255,255,255,.96);
 border-radius:10px;padding:8px 11px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--navy);
 box-shadow:0 2px 10px rgba(0,41,116,.18);display:flex;align-items:center;gap:6px}
.mapbtn svg{width:13px;height:13px}
.mapfallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;
 font-size:12.5px;color:var(--muted)}
body.nomap .mapfallback{display:grid}

/* stops */
.stops{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 6px;background:var(--card)}
.slist{list-style:none;padding:0;position:relative}
.slist li{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:11px;min-height:42px;position:relative}
.rail{position:relative;height:100%;display:grid;place-items:center}
.rail::before,.rail::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:2px;background:var(--line)}
.rail::before{top:0;height:50%}.rail::after{bottom:0;height:50%}
.slist li:first-child .rail::before,.slist li:last-child .rail::after{display:none}
.slist li.done .rail::before,.slist li.done .rail::after{background:#C6D0E0}
.pip{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid #C6D0E0;position:relative;z-index:2}
li.you .pip{width:15px;height:15px;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,99,240,.15)}
li.bus .pip{width:26px;height:26px;border:0;background:var(--blue);display:grid;place-items:center;
 box-shadow:0 2px 8px rgba(0,99,240,.4)}
li.bus .pip svg{width:15px;height:15px;color:#fff}
.snm{font-size:16px;font-weight:500;letter-spacing:-.01em}
li.done .snm{color:#9AA6BC;font-weight:400}
li.you .snm{font-weight:700;color:var(--navy)}
.ssub{display:block;font-size:11px;font-weight:600;color:var(--blue);margin-top:1px}
li.done .ssub{color:#9AA6BC;font-weight:500}
.stime{font-size:15px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;text-align:right}
.stime small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
li.done .stime{color:#9AA6BC;font-weight:500}
.eta{color:var(--blue)}

/* actions */
.buycta{display:block;width:100%;text-decoration:none;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:12px 14px;
 font-family:var(--font);text-align:center;box-shadow:0 5px 16px rgba(0,99,240,.26);margin-bottom:9px}
.buycta b{display:block;font-size:17.5px;font-weight:700;letter-spacing:-.015em;line-height:1.18}
.buycta i{display:block;font-style:normal;font-size:16px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.buycta:active{background:var(--blue-dark);transform:translateY(1px)}
.footwrap{flex:none;padding:9px 14px calc(env(safe-area-inset-bottom) + 10px);background:rgba(249,249,251,.96);
 border-top:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0;
 background:rgba(249,249,251,.96);border-top:1px solid var(--line);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.act{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 8px;font-family:var(--font);
 font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px}
.act:active{background:#F1F4FA}
.act svg{width:17px;height:17px;color:var(--blue)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,35,66,.42);opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;max-height:84dvh;
 display:flex;flex-direction:column;transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);
 box-shadow:0 -12px 40px rgba(0,41,116,.22)}
.sh.on{transform:translateY(0)}
.sh__grab{width:38px;height:4px;border-radius:99px;background:#D3DAE7;margin:9px auto 0;flex:none}
.sh__hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px 9px;flex:none}
.sh__hd h3{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.sh__x{border:0;background:#F1F4FA;border-radius:999px;padding:7px 12px;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--navy)}
.segs{display:flex;gap:4px;margin:0 14px 10px;background:#EEF1F7;border-radius:11px;padding:3px;flex:none}
.seg{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-family:var(--font);font-size:12.5px;
 font-weight:600;color:var(--muted);line-height:1.15}
.seg[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,41,116,.12)}
.times{overflow-y:auto;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
.hourrow{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #EEF1F7}
.hourrow b{font-size:14px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;padding-top:2px}
.mins{display:flex;flex-wrap:wrap;gap:6px}
.min{font-size:13px;font-weight:600;color:var(--ink);background:#F4F6FA;border-radius:7px;padding:4px 7px;
 font-variant-numeric:tabular-nums}
.min.past{background:#F7F8FB;color:#B7C0CF;font-weight:500}
.min.next{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,99,240,.35);position:relative}
.hourrow.now{background:#F2F7FF;border-radius:10px;padding-left:6px;padding-right:6px;margin:0 -6px}
.hourrow.now b{color:var(--blue)}
.hourrow.now b::after{content:"";display:block;height:2px;border-radius:2px;background:var(--blue);margin-top:3px}
.nomore{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5C3B00;border-radius:10px;
 padding:9px 11px;font-size:12.5px;font-weight:600;text-align:center;margin-bottom:8px}
.shnote{padding:10px 18px 0;font-size:11.5px;color:var(--muted);line-height:1.35}
/* traka preko karte kad nema zivog podatka */
.mapnote{position:absolute;left:10px;right:10px;top:10px;z-index:3;display:none;align-items:center;gap:7px;
 background:rgba(10,35,66,.88);color:#fff;border-radius:10px;padding:8px 11px;font-size:11.5px;font-weight:600;
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mapnote.on{display:flex}
.mapnote svg{width:14px;height:14px;flex:none;opacity:.85}
.dbtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 62px);z-index:15;border:0;
 background:#0A2342;color:#fff;border-radius:999px;padding:8px 12px;font-family:var(--font);font-size:11px;
 font-weight:700;letter-spacing:.03em;box-shadow:0 4px 14px rgba(10,35,66,.35);display:flex;align-items:center;gap:6px}
.dbtn svg{width:13px;height:13px}
.dhint{padding:9px 18px 0;font-size:11.5px;color:var(--muted)}
.llist{list-style:none;padding:6px 0 calc(env(safe-area-inset-bottom) + 10px);margin:0;overflow-y:auto}
.llist li{border-bottom:1px solid #EEF1F7}.llist li:last-child{border-bottom:0}
.lrow{width:100%;background:none;border:0;display:flex;align-items:center;gap:12px;padding:12px 18px;
 font-family:var(--font);text-align:left;color:var(--ink)}
.lrow__nm{flex:1;font-size:15.5px;font-weight:600}
.lrow__tick{flex:none;width:18px;height:18px;color:var(--blue);opacity:0}
.lrow[aria-selected="true"] .lrow__tick{opacity:1}
.lrow[aria-selected="true"] .lrow__nm{color:var(--blue)}
li.ghost .pip{background:#fff;border:2.4px dashed var(--blue)}
li.ghost .pip svg{color:var(--blue);width:13px;height:13px}
.rlab{display:block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#9AA6BC;line-height:1.1}
@media (min-width:520px){.dbtn{right:calc(50% - 215px + 12px)}}
.stopshd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0 4px;
 position:sticky;top:0;background:var(--card);z-index:3}
.stopshd__t{font-size:10.5px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--muted)}
.pill{flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--orange);
 border-radius:999px;padding:7px 13px;font-family:var(--font);font-size:12.5px;font-weight:700;
 color:#fff;letter-spacing:.01em;box-shadow:0 2px 8px rgba(218,93,35,.32)}
.pill:active{background:#BE4C1B;transform:translateY(1px)}
.pill svg{width:13px;height:13px;color:#fff}
.slist{position:relative}
.busdot{position:absolute;z-index:4;width:26px;height:26px;border-radius:50%;background:var(--blue);
 display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,99,240,.45);
 transform:translate(-50%,-50%);transition:top .35s linear;pointer-events:none}
.busdot svg{width:15px;height:15px;color:#fff}
.slist li.bus .pip{opacity:0}
.fresh{display:flex;align-items:center;gap:5px;justify-content:flex-end;
 font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.freshdot{width:5.5px;height:5.5px;border-radius:50%;background:#16A34A;flex:none;
 animation:p 2.4s ease-in-out infinite}
.slist li.grp{min-height:34px;cursor:pointer}
.slist li.grp .rail{position:relative}
.segline{position:absolute;left:50%;top:0;bottom:0;width:0;
 border-left:2px dotted var(--line);transform:translateX(-1px)}
.segbtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:9px 0;
 font-family:var(--font);font-size:13px;font-weight:600;color:var(--blue);text-align:left}
.segbtn svg{width:11px;height:11px;transition:transform .2s}
.segbtn.open svg{transform:rotate(180deg)}
.slist li.mini{min-height:29px;cursor:pointer}
.pip--sm{width:6px!important;height:6px!important;border-width:2px!important}
.snm--sm{font-size:14px;font-weight:400;color:#4A5C78;letter-spacing:-.005em}
.stime--sm{font-size:12.5px;font-weight:500;color:var(--dim)}
.stime.now{font-size:14px;font-weight:800;color:#0F7B6C;letter-spacing:.02em;
 text-transform:uppercase;animation:pulseNow 1.6s ease-in-out infinite}
.stime.soon{font-size:14.5px;font-weight:700;color:var(--blue)}
@keyframes pulseNow{0%,100%{opacity:1}50%{opacity:.55}}
.slist li.mini.exit .snm--sm{font-weight:700;color:#0F7B6C}
.slist li.mini.exit .pip--sm{background:#0F7B6C!important;border-color:#0F7B6C!important}
.slist li.gap{min-height:30px}
.slist li.gap .rail::before,.slist li.gap .rail::after{border-left:2px dotted var(--line);
 background:none;width:0;transform:translateX(-1px)}
.morerow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;
 background:none;padding:11px 0;font-family:var(--font);font-size:13px;font-weight:600;color:var(--blue)}
.morerow svg{width:11px;height:11px;transition:transform .2s}
.morerow.open svg{transform:rotate(180deg)}
.slist li.tapable{cursor:pointer}
.slist li.exit .pip{background:#0F7B6C;border-color:#0F7B6C;width:15px;height:15px;
 box-shadow:0 0 0 4px rgba(15,123,108,.16)}
.slist li.exit .snm{font-weight:700;color:#0F7B6C}
.slist li.exit .ssub{color:#0F7B6C}
.exitbtn{grid-column:1/-1;margin:2px 0 6px 37px;border:0;background:#E7F4F1;color:#0F7B6C;
 border-radius:9px;padding:7px 12px;font-family:var(--font);font-size:12.5px;font-weight:600;
 justify-self:start}
.tilewarn{position:absolute;left:10px;right:10px;bottom:52px;z-index:4;background:rgba(10,35,66,.9);
 color:#fff;border-radius:9px;padding:8px 11px;font-size:11.5px;font-weight:600;text-align:center;
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.maplibregl-ctrl-attrib{font-size:9px!important}
@media (max-height:660px){:root{--map:26dvh}.slist li{min-height:42px}}
@media (max-height:560px){:root{--map:22dvh}.disr p{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}
 .scrim,.sh{max-width:430px;margin:0 auto}}
.alllines{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);
 margin:0 0 8px;letter-spacing:.01em;line-height:1.3}
</style>
<link rel="manifest" href="./manifest.json?v=2026-08-24.2">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

</head><body>

<div class="top">
  <button class="back" type="button" aria-label="Natrag">
    <svg viewBox="0 0 16 16" fill="none"><path d="M10 2 4 8l6 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="top__mid">
    <span class="lbadge">2</span>
    <div class="top__txt">
      <div class="top__dir" data-i18n="line.dir"></div>
      <div class="top__dest">Poluotok</div>
    </div>
  </div>
  <div class="status" id="status">
    <span class="statsub" id="statSub"></span>
  </div>
</div>

<div class="disr">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.6 21 19H3l9-15.4Z"/><path d="M12 9.5v4.2M12 16.4h.01"/></svg>
  <div>
    <b data-i18n="disr.title"></b>
    <p>Radovi na Obali kneza Trpimira, kašnjenja do 8 min do 15:30.</p>
  </div>
</div>

<div class="mapwrap">
  <div id="map"></div>
  <div class="mapfallback">Karta se ne može prikazati.<br>Provjeri da su <code>maplibre-gl.js</code> i <code>maplibre-gl.css</code> u istoj mapi.</div>
  <div class="mapnote" id="mapnote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg>
    <span id="mapnoteTxt"></span>
  </div>
  <button class="mapbtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    <span data-i18n="line.expandMap"></span>
  </button>
</div>

<div class="stops">
  <div class="stopshd">
    <span class="stopshd__t" data-i18n="line.tapToSet"></span>
    <button class="pill" id="schedBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><rect x="3.2" y="4.6" width="17.6" height="15.2" rx="2.8"/><path d="M3.2 9.4h17.6M8 4.6V2.6M16 4.6V2.6"/></svg>
      <span data-i18n="line.schedule"></span>
    </button>
  </div>
  <ul class="slist" id="slist"></ul>
</div>

<div class="footwrap">
<p class="alllines" data-i18n="buy.allLines"></p>
<a class="buycta" href="./kupi.html"><b id="buyMain"></b><i>1,50 €</i></a>
</div>

<button class="dbtn" id="dbtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  <span id="dbtnLbl">STANJE</span>
</button>

<div class="scrim" id="scrim"></div>

function etaHTML(i){

function stopRow(i,liveRun){

function scrollToBus(){
  const box=document.querySelector('.stops');
  const rows=[...document.querySelectorAll('#slist li.tapable')];
  if(!box||!rows.length) return;
  const i=Math.max(0,Math.min(rows.length-1,Math.floor(BUS_FRAC)));
  const anchor=rows[Math.max(0,i-1)];          /* jedna prosla stanica iznad autobusa */
  const hd=document.querySelector('.stopshd');
  const hdH=hd?hd.getBoundingClientRect().height:0;
  /* racunamo iz stvarnih pozicija: pomak = koliko je sidro ispod gornjeg ruba okvira */
  const delta=anchor.getBoundingClientRect().top - box.getBoundingClientRect().top - hdH - 2;
  box.scrollTop=Math.max(0, box.scrollTop + delta);
}

    document.getElementById('mapnoteTxt').textContent=t('line.trackFrom',CUR).replace('{t}',sc.note);}
  else mn.classList.remove('on');
  const dl=document.getElementById('dbtnLbl'); if(dl) dl.textContent=t(DLBL[SC],CUR).toUpperCase();
  placeBusDot();
  if(FIRST_SCROLL && liveRun){ FIRST_SCROLL=false; requestAnimationFrame(scrollToBus); }
}

/* ---------- vozni red ---------- */
/* Vozni red istice sljedeci polazak: prosli su prigusen, sljedeci plav,
   a tekuci sat dobiva blagu podlogu. Vrijedi samo za danasnji dan.  */
function todayKind(){
  const d=new Date().getDay();          /* 0 = nedjelja */
  return d===0 ? 'sunday' : (d===6 ? 'saturday' : 'weekday');
}
function renderSched(day){
  const box=document.getElementById('times'); box.innerHTML='';
  const byHour={};
  SCHEDULE[day].forEach(tm=>{const [h,m]=tm.split(':');(byHour[h]=byHour[h]||[]).push(m);});
  const isToday = (day===todayKind());
  const now=new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  /* prvi polazak koji jos nije prosao */
  let nextKey=null;
  if(isToday){
    const all=SCHEDULE[day].map(t=>{const [h,m]=t.split(':');return {t:t, v:+h*60 + +m};})
                           .sort((a,b)=>a.v-b.v);
    const nx=all.find(x=>x.v>=nowMin);
    nextKey = nx ? nx.t : null;
  }
  let nextRow=null;
  Object.keys(byHour).sort().forEach(h=>{
    const r=document.createElement('div'); r.className='hourrow';
    if(isToday && nextKey && nextKey.slice(0,2)===h) { r.classList.add('now'); nextRow=r; }
    r.innerHTML='<b>'+h+'</b><div class="mins">'+byHour[h].map(m=>{
      const key=h+':'+m, v=+h*60 + +m;
      let cls='min';
      if(isToday){
        if(key===nextKey) cls+=' next';
        else if(v<nowMin) cls+=' past';
      }
      return '<span class="'+cls+'">'+m+'</span>';}).join('')+'</div>';
    box.appendChild(r);
  });
  if(isToday && !nextKey){
    const p=document.createElement('p'); p.className='nomore';
    p.textContent=t('sched.noMore',CUR); box.insertBefore(p, box.firstChild);
  }
  /* pomakni popis na tekuci sat */
  if(nextRow) requestAnimationFrame(()=>{
    box.scrollTop = Math.max(0, nextRow.offsetTop - box.clientHeight/2 + nextRow.offsetHeight/2);
  });
  else box.scrollTop=0;
}
const scrim=document.getElementById('scrim'), sh=document.getElementById('sh');
document.getElementById('schedBtn').addEventListener('click',()=>{
  const k=todayKind();
  document.querySelectorAll('.seg').forEach(x=>x.setAttribute('aria-selected', x.dataset.day===k));
  renderSched(k);
  scrim.classList.add('on');sh.classList.add('on');});
document.getElementById('shX').addEventListener('click',()=>{scrim.classList.remove('on');sh.classList.remove('on');});

document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>{

/* ---------- karta (MapLibre, bez tile servera) ---------- */
function lnglat(a){return a.map(p=>[p[1],p[0]]);}
function initMap(){
  if(typeof maplibregl==='undefined'){document.body.classList.add('nomap');return;}
  const line=lnglat(ROUTE);
  const map=new maplibregl.Map({
    container:'map', attributionControl:false, dragRotate:false, pitchWithRotate:false,
    style:{version:8,
      sources:{
        osm:{type:'raster',tiles:[TILE_URL],tileSize:256,attribution:TILE_ATTR,maxzoom:19}
      },
      layers:[
        {id:'bg',type:'background',paint:{'background-color':'#E8EEF2'}},
        {id:'osm',type:'raster',source:'osm',paint:{'raster-opacity':1,'raster-fade-duration':180}}
      ]},
    bounds:routeBounds(), fitBoundsOptions:{padding:{top:26,bottom:26,left:22,right:22},maxZoom:15}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
  /* ako podloga ne moze do interneta, javi to umjesto praznog plavog */
  let tilesOK=false;
  map.on('data',e=>{ if(e.sourceId==='osm'&&e.isSourceLoaded) tilesOK=true; });
  map.on('error',e=>{ if(e&&e.sourceId==='osm') showTileWarn(); });
  setTimeout(()=>{ if(!tilesOK) showTileWarn(); }, 6000);
  map.on('style.load',()=>{
    map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:line}}});
    map.addLayer({id:'route-halo',type:'line',source:'route',
      paint:{'line-color':'#FFFFFF','line-width':10,'line-opacity':.95},layout:{'line-cap':'round','line-join':'round'}});
    map.addLayer({id:'route',type:'line',source:'route',
      paint:{'line-color':'#0063F0','line-width':5.2},layout:{'line-cap':'round','line-join':'round'}});
    const feats=STOPS.map(s=>({type:'Feature',properties:{name:s[0],you:s[3]==='you'?1:0},
      geometry:{type:'Point',coordinates:[s[2],s[1]]}}));
    map.addSource('stops',{type:'geojson',data:{type:'FeatureCollection',features:feats}});
    map.addLayer({id:'stops',type:'circle',source:'stops',
      filter:['!=',['get','you'],1],
      minzoom:12.6,
      paint:{'circle-radius':['interpolate',['linear'],['zoom'],12.6,2.6,15,4.2],
             'circle-color':'#FFFFFF',
             'circle-stroke-color':'#0063F0','circle-stroke-width':1.8,
             'circle-opacity':0.95}});
    /* oznaka korisnicke stanice: pin + kompaktna plocica */
    const you=STOPS.find(s=>s[3]==='you');
    const mk=document.createElement('div');
    mk.className='stopmk';
    mk.innerHTML=
      '<div class="stopmk__lab"><div class="stopmk__nm">'+you[0]+'</div>'+
      '<div class="stopmk__sb">'+t('line.yourStopPin',CUR)+'</div></div>'+
      '<div class="stopmk__tip"></div>'+
      '<svg class="stopmk__pin" width="26" height="34" viewBox="0 0 26 34" fill="none">'+
        '<path d="M13 33.2C13 33.2 24.4 20.9 24.4 13.2A11.4 11.4 0 0 0 1.6 13.2C1.6 20.9 13 33.2 13 33.2Z" '+
          'fill="#0063F0" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>'+
        '<rect x="7.6" y="6.6" width="10.8" height="9" rx="2" fill="#fff"/>'+
        '<path d="M7.6 11.1h10.8" stroke="#0063F0" stroke-width="1.3"/>'+
        '<circle cx="9.9" cy="13.4" r="1" fill="#0063F0"/><circle cx="16.1" cy="13.4" r="1" fill="#0063F0"/>'+
        '<path d="M9.3 15.6v1.5M16.7 15.6v1.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>'+
      '</svg>';
    new maplibregl.Marker({element:mk,anchor:'bottom',offset:[0,2]})
      .setLngLat([you[2],you[1]]).addTo(map);

    /* autobus */
    const el=document.createElement('div');
    el.style.cssText='width:30px;height:30px;border-radius:50%;background:#0063F0;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,41,116,.45);border:2.5px solid #fff';
    el.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2.6"/><path d="M4 10.5h16M7.5 20v-2M16.5 20v-2"/></svg>';
    const s=SCEN[SC];
    if(s.veh==='ret'||s.veh==='term'){
      el.style.background='#fff'; el.style.border='2.6px dashed #0063F0';
      el.querySelector('svg').setAttribute('stroke','#0063F0');
      el.style.boxShadow='0 2px 8px rgba(0,41,116,.25)';
    }
    if(s.busT!==null){
      const bus=new maplibregl.Marker({element:el}).setLngLat(at(line,s.busT)).addTo(map);
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!reduce && s.veh==='run'){
        /* Server salje poziciju svakih ~10 s. Izmedu dva ocitanja klizimo linearno
           po trasi, pa je kretanje glatko umjesto skakanja po stanicama.        */
        let shown=s.busT, target=s.busT, lastPing=Date.now();
        setInterval(()=>{ target+=0.012; if(target>1) target=0; lastPing=Date.now();
          LAST_PING=0; const ft=document.getElementById('freshTxt');
          if(ft) ft.textContent=t('line.updatedAgo',CUR).replace('{n}',0);
        },4000);
        setInterval(()=>{
          shown += (target-shown)*0.06;
          if(Math.abs(target-shown)<1e-5) shown=target;
          bus.setLngLat(at(line,shown));
          /* isti napredak koristi i marker u popisu ispod karte */
          const prev=Math.floor(BUS_FRAC);
          BUS_FRAC = shown*(STOPS.length-1);
          if(Math.floor(BUS_FRAC)!==prev) renderStops();   /* presao stanicu -> osvjezi popis */
          else {
            placeBusDot();
            refreshEtas();
          }
        },50);
        setInterval(()=>{ LAST_PING=Math.round((Date.now()-lastPing)/1000);
          const ft=document.getElementById('freshTxt');
          if(ft) ft.textContent=t('line.updatedAgo',CUR).replace('{n}',LAST_PING);
        },1000);
      }
      if(!reduce && s.veh==='ret'){let tt=s.busT;
        setInterval(()=>{tt-=0.0012;if(tt<0)tt=1;bus.setLngLat(at(line,tt));},60);}
    }
  });
  map.on('error',()=>{});
  MAP=map;
  const mb=document.querySelector('.mapbtn');
  if(mb) mb.addEventListener('click',toggleFull);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&FULL) toggleFull();});
}
let MAP=null, FULL=false;
function toggleFull(){
  if(!MAP) return;
  FULL=!FULL;
  document.body.classList.toggle('mapfull',FULL);
  const lbl=document.querySelector('.mapbtn span');
  if(lbl) lbl.textContent = FULL ? t('line.collapseMap',CUR) : t('line.expandMap',CUR);
  const ic=document.querySelector('.mapbtn svg');
  if(ic) ic.innerHTML = FULL
    ? '<path d="M9 3v6H3M15 21v-6h6M3 15h6v6M21 9h-6V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'
    : '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
  setTimeout(()=>{
    MAP.resize();
    /* fitBounds sam uklapa i sirinu i visinu i uzima manji zoom, pa je trasa uvijek cijela vidljiva */
    MAP.fitBounds(routeBounds(), {
      padding: FULL ? {top:60,bottom:60,left:32,right:32} : {top:26,bottom:26,left:22,right:22},
      maxZoom: 15, duration: 320
    });
  },320);
}
/* ---- PODLOGA KARTE ----------------------------------------------------
   Zamijeni TILE_URL svojim providerom prije produkcije.
   Javni tile.openstreetmap.org NIJE dopusten za produkciju (OSM Tile Usage Policy).
   Alternative: MapTiler, Stadia Maps, Protomaps, ili vlastiti tile server.     */
const TILE_URL  = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_ATTR = '© OpenStreetMap contributors';

function routeBounds(){
  let w=180,e=-180,ss=90,n=-90;
  ROUTE.forEach(p=>{ss=Math.min(ss,p[0]);n=Math.max(n,p[0]);w=Math.min(w,p[1]);e=Math.max(e,p[1]);});
  return [[w,ss],[e,n]];
}
function showTileWarn(){
  const w=document.querySelector('.mapwrap'); if(!w||w.querySelector('.tilewarn')) return;
  const d=document.createElement('div'); d.className='tilewarn';
  d.textContent='Podloga karte nije dostupna. Trasa i stanice su i dalje točne.';
  w.appendChild(d);
}
function at(line,f){
  let tot=0;const seg=[];
  for(let i=1;i<line.length;i++){const d=Math.hypot(line[i][0]-line[i-1][0],line[i][1]-line[i-1][1]);seg.push(d);tot+=d;}
  let want=tot*Math.max(0,Math.min(1,f)),acc=0;
  for(let i=0;i<seg.length;i++){
    if(acc+seg[i]>=want){const r=(want-acc)/seg[i];
      return [line[i][0]+(line[i+1][0]-line[i][0])*r, line[i][1]+(line[i+1][1]-line[i][1])*r];}
    acc+=seg[i];}
  return line[line.length-1];
}

}
