<html lang="hr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Ulazak u autobus · Liburnija d.o.o.</title>

<style>
html{touch-action:manipulation}
button,a,input,select,label,summary,[role="button"]{touch-action:manipulation}

:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --orange:#DA5D23;--amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.demobar{flex:none;background:var(--amber-bg);border-bottom:1px solid var(--amber-line);color:#5C3B00;
 padding:7px 14px;font-size:11px;font-weight:700;text-align:center}
/* zaglavlje: u koji autobus ulazim */
.bus{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 12px) 14px 14px;display:flex;align-items:center;gap:12px}
.bus__b{flex:none;min-width:46px;height:38px;border-radius:11px;background:var(--blue);color:#fff;
 font-size:19px;font-weight:800;line-height:38px;text-align:center;padding:0 10px}
.bus__t{flex:1;min-width:0}
.bus__d{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.02em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bus__v{font-size:12.5px;color:var(--muted);margin-top:1px}
.bus__x{flex:none;border:0;background:#F1F4FA;border-radius:10px;padding:8px 11px;font-family:var(--font);
 font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;text-align:center;line-height:1.2}
.wrap{flex:1 1 auto;padding:14px 14px 0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--muted);
 margin:0 2px 9px}
/* vrste karata */
.types{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tp{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 11px;text-align:left;
 font-family:var(--font);position:relative}
.tp[aria-pressed="true"]{border-color:var(--blue);background:#F2F7FF;box-shadow:0 0 0 3px rgba(0,99,240,.1)}
.tp__n{font-size:14.5px;font-weight:700;color:var(--navy);letter-spacing:-.015em;line-height:1.15}
.tp__s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.25;min-height:28px}
.tp__p{font-size:17px;font-weight:800;color:var(--navy);margin-top:5px;font-variant-numeric:tabular-nums}
.tp__lock{position:absolute;top:9px;right:9px;width:14px;height:14px;color:var(--amber)}
/* putnici */
.paxbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;
 display:flex;align-items:center;justify-content:space-between;gap:12px}
.paxbox__l{font-size:15.5px;font-weight:600;color:var(--navy)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border:1.5px solid var(--line);background:#fff;border-radius:13px;
 font-size:24px;font-weight:600;color:var(--navy);line-height:1;display:grid;place-items:center}
.stepper button:active{background:#EFF4FC;border-color:var(--blue)}
.stepper button:disabled{color:#CBD3E0;background:#F6F8FB;border-color:#EDF0F6}
.stepper .n{min-width:34px;text-align:center;font-size:26px;font-weight:800;color:var(--navy);
 font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding:0 4px}
.total__l{font-size:14px;color:var(--muted)}
.total__r{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
/* podnozje */
.foot{flex:none;position:sticky;bottom:0;background:rgba(249,249,251,.97);border-top:1px solid var(--line);
 padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.accept{display:flex;align-items:flex-start;gap:11px;cursor:pointer;padding:0 2px 11px}
.accept input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2.5px solid #B9C3D4;
 border-radius:8px;flex:none;background:#fff;position:relative;margin-top:1px}
.accept input:checked{background:var(--blue);border-color:var(--blue)}
.accept input:checked::after{content:"";position:absolute;left:7.5px;top:2.5px;width:7px;height:13px;
 border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.accept span{font-size:14.5px;line-height:1.35}
.accept a{color:var(--muted)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pay{display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;
 padding:16px 8px;font-family:var(--font);font-size:15.5px;font-weight:700;min-height:58px}
.pay--apple{background:#000;color:#fff}
.pay--google{background:#fff;color:#3C4043;border:1px solid #DADCE0}
.pay--city{background:#0A2342;color:#fff;flex-direction:column;gap:2px}
.pay--city b{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.pay--city i{font-style:normal;font-size:11.5px;font-weight:600;opacity:.72}
.pay--link{background:#fff;color:var(--navy);border:1px dashed #C3CBD9;flex-direction:column;gap:2px}
.pay--link b{font-size:14px;font-weight:700}
.pay--link i{font-style:normal;font-size:11px;color:var(--muted)}
.pay.off{opacity:.45;pointer-events:none}
.pmlogo{width:20px;height:20px;flex:none}
.busy{position:fixed;inset:0;z-index:30;background:rgba(255,255,255,.94);display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:14px}
.busy.on{display:flex}
.spin{width:34px;height:34px;border:3px solid #DDE3EC;border-top-color:var(--blue);border-radius:50%;
 animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,35,66,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.alert{position:fixed;left:18px;right:18px;top:50%;transform:translateY(-50%) scale(.96);z-index:41;
 background:#fff;border-radius:20px;padding:22px 20px 18px;text-align:center;opacity:0;pointer-events:none;
 transition:opacity .2s,transform .2s;box-shadow:0 20px 50px rgba(10,35,66,.3)}
.alert.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.alert b{display:block;font-size:18px;font-weight:800;color:var(--navy)}
.alert p{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.alert button{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:14px;margin-top:16px;
 font-family:var(--font);font-size:16px;font-weight:700}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}
 .alert{max-width:394px;left:50%;right:auto;transform:translate(-50%,-50%) scale(.96)}
 .alert.on{transform:translate(-50%,-50%) scale(1)}}
</style>
</head>

<div class="demobar" data-i18n="exp.demo"></div>
<div class="bus">
  <span class="bus__b" id="busNo">2</span>
  <span class="bus__t"><span class="bus__d" id="busDest">—</span>
    <span class="bus__v" id="busVeh"></span></span>
  <a class="bus__x" href="./skener.html" data-i18n="exp.rescan"></a>
</div>
<div class="wrap">
  <p class="lbl" data-i18n="exp.pickType"></p>
  <div class="types" id="types"></div>

  <div class="paxbox">
    <span class="paxbox__l" data-i18n="exp.pax"></span>
    <span class="stepper">
      <button id="minus" type="button" aria-label="−">−</button>
      <span class="n" id="pax">1</span>
      <button id="plus" type="button" aria-label="+">+</button>
    </span>
  </div>

  <div class="total"><span class="total__l" id="perPax"></span>
    <span class="total__r" id="total">1,50 €</span></div>
</div>

<div class="foot">
  <label class="accept"><input id="accept" type="checkbox">
    <span><span data-i18n="exp.accept"></span>
      <a href="./uvjeti.html" data-i18n="about.terms"></a></span></label>
  <div class="pays">
    <button class="pay pay--apple off" id="payWallet" type="button"></button>
    <button class="pay pay--city off" id="payCity" type="button"></button>
  </div>
</div>

<div class="busy" id="busy"><div class="spin"></div><p data-i18n="pay.processing"></p></div>
<div class="scrim" id="scrim"></div>
<div class="alert" id="alert" role="alertdialog" aria-modal="true">
  <b data-i18n="buy.mustAccept"></b>
  <p data-i18n="buy.mustAcceptSub"></p>
  <button id="alertOk" type="button" data-i18n="buy.ok"></button>
</div>

  return 'ZD-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+
    String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }

const P=new URLSearchParams(location.search);
const BUS={line:P.get('bus')||'2', veh:P.get('veh')||'', dest:P.get('dest')||''};
let TYPE='single', pax=1;

function renderTypes(){
  const g=q('types'); g.innerHTML='';
  ['single','day','air','three','week'].forEach(k=>{
    const T=TYPES[k];
    const b=document.createElement('button'); b.className='tp'; b.type='button';
    b.setAttribute('aria-pressed', String(k===TYPE));
    b.innerHTML=(T.auth?LOCK:'')+
      '<div class="tp__n">'+t(T.k,CUR)+'</div>'+
      '<div class="tp__s">'+t(T.s,CUR)+'</div>'+
      '<div class="tp__p">'+eur(T.price)+'</div>';
    b.onclick=()=>{ TYPE=k; renderTypes(); upd(); };
    g.appendChild(b);
  });
}
function upd(){
  const T=TYPES[TYPE];
  q('pax').textContent=pax;
  q('minus').disabled=(pax<=1); q('plus').disabled=(pax>=6);
  const total=pax*T.price;
  q('perPax').textContent=eur(T.price)+' × '+pax;
  q('total').textContent=eur(total);
  /* novcanik ovisi o uredaju */
  const w=q('payWallet');
  if(isIOS()){ w.className='pay pay--apple'; w.innerHTML=APPLE+'<span>Pay</span>'; }
  else { w.className='pay pay--google'; w.innerHTML=GOOGLE+'<span>Pay</span>'; }
  const cc=cityCard();
  const c=q('payCity');
  if(cc){ c.className='pay pay--city';
    c.innerHTML='<b>'+t('exp.cityCard',CUR)+'</b><i>'+t('exp.cityCardSub',CUR).replace('{b}',eur(cc.balance))+'</i>'; }
  else { c.className='pay pay--link';
    c.innerHTML='<b>'+t('exp.cityCard',CUR)+'</b><i>'+t('exp.link',CUR)+'</i>'; }
  const blocked = T.auth && !account();
  [w,c].forEach(x=>x.classList.toggle('off', blocked));
}
q('minus').onclick=()=>{ if(pax>1){pax--;upd();} };
q('plus').onclick=()=>{ if(pax<6){pax++;upd();} };

function alertOn(){ q('scrim').classList.add('on'); q('alert').classList.add('on'); }
function alertOff(){ q('scrim').classList.remove('on'); q('alert').classList.remove('on'); }
q('alertOk').onclick=alertOff; q('scrim').onclick=alertOff;

function pay(method){
  if(!q('accept').checked){ alertOn(); return; }
  const cc=cityCard();
  if(method==='city' && !cc){ location.href='./kartica.html?from=exp&bus='+encodeURIComponent(BUS.line)+'&veh='+encodeURIComponent(BUS.veh)+'&dest='+encodeURIComponent(BUS.dest); return; }
  const T=TYPES[TYPE];
  q('busy').classList.add('on');
  setTimeout(()=>{
    const o={no:mkOrderNo(), type:TYPE, pax:pax, total:pax*T.price, method:method,
      status:'paid', ticket:(()=>{const p=()=>Math.random().toString(36).slice(2,6).toUpperCase();
        return p()+'-'+p()+'-'+p();})(),
      created:Date.now(), paid:Date.now(), terms:Date.now(),
      bus:BUS.line, veh:BUS.veh, dest:BUS.dest};
    orderSave(o);
    try{ const m=JSON.parse(localStorage.getItem('ticketKeys')||'{}');
      let k=localStorage.getItem('devKey');
      if(!k){ k=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
        localStorage.setItem('devKey',k); }
      m[o.no]=k; localStorage.setItem('ticketKeys',JSON.stringify(m)); }catch(e){}
    location.href='./karta.html?no='+encodeURIComponent(o.no);
  },1600);
}
q('payWallet').onclick=()=>pay(isIOS()?'apple':'google');
q('payCity').onclick=()=>pay('city');
q('accept').onchange=upd;

applyI18n();
q('busNo').textContent=BUS.line;
q('busDest').textContent=BUS.dest || t('exp.title',CUR);
q('busVeh').textContent=BUS.veh ? t('exp.veh',CUR).replace('{v}',BUS.veh) : '';
renderTypes(); upd();

</script>
