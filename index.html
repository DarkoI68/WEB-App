.hero__bar{position:absolute;inset:0 0 auto 0;padding:calc(env(safe-area-inset-top) + 11px) 16px 0;
 display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mark{color:var(--navy);text-decoration:none;display:flex;flex-direction:column;gap:1px}
.mark b{font-weight:600;font-size:18px;letter-spacing:.085em;text-transform:uppercase}
.mark i{font-style:normal;font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.66}
.lang{flex:none;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);border:0;
 border-radius:999px;padding:6px 11px;font-family:var(--font);font-size:12.5px;font-weight:600;line-height:1;
 color:var(--navy);box-shadow:0 2px 10px rgba(0,41,116,.16)}
.lang svg{width:11px;height:11px;opacity:.55}
.sheet{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);
 border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:2;padding:12px 16px 10px;
 box-shadow:0 -8px 24px rgba(0,41,116,.09);display:flex;flex-direction:column}
.eyebrow{text-align:center;font-size:12px;color:var(--muted)}
h1{text-align:center;font-size:clamp(22px,6.6vw,28px);line-height:1.06;letter-spacing:-.025em;color:var(--navy);font-weight:700}
.dirline{text-align:center;font-size:11.5px;color:var(--muted);margin-top:2px}
.perf{height:1px;margin:10px -16px 0;position:relative;
 background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 11px)}
.perf::before,.perf::after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:#fff}
.perf::before{left:-8px}.perf::after{right:-8px}

/* zastoj */
.disr{display:none;gap:8px;align-items:flex-start;background:var(--amber-bg);border:1px solid var(--amber-line);
 border-radius:11px;padding:8px 10px;margin-top:10px;color:#5C3B00}
.disr.on{display:flex}
.disr svg{width:15px;height:15px;flex:none;color:var(--amber);margin-top:1px}
.disr b{display:block;font-size:11.5px;font-weight:700}
.disr p{font-size:11px;line-height:1.32;margin-top:1px;color:#6E4E15}

.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:11px 2px 0}
h2{font-size:11px;letter-spacing:.085em;text-transform:uppercase;color:var(--muted);font-weight:700}
.livetag{display:none;align-items:center;gap:4px;background:var(--green-bg);color:var(--green);
 border-radius:999px;padding:3px 7px;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.livetag.on{display:flex}
.dot{width:5.5px;height:5.5px;border-radius:50%;background:#16A34A;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

/* dolasci */
.arr{list-style:none;padding:0}
.arr li{border-bottom:1px solid var(--line)}
.rowlink{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:11px;
 min-height:46px;text-decoration:none;color:inherit}
.rowlink:active{background:#F1F4FA;border-radius:9px}
.chev{width:8px;height:13px;flex:none;color:#C3CBD9;margin-left:1px}
body.nochev .chev{display:none}
body.nochev .rowlink{grid-template-columns:auto 1fr auto}
.arr li:last-child{border-bottom:0}
.badge{flex:none;min-width:32px;height:23px;border-radius:7px;color:#fff;padding:0 6px;font-family:var(--font);
 font-size:12px;font-weight:700;line-height:23px;text-align:center}
.l1{background:var(--orange)}.l2{background:var(--blue)}.l3{background:var(--purple)}.l4{background:#0F7B6C}
.mid{min-width:0}
.dest{font-size:16.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:10.5px;font-weight:600;line-height:1.25;margin-top:1px;color:var(--muted)}
.sub.b{color:var(--blue)}.sub.a{color:var(--amber)}.sub.g{color:var(--green)}
.right{text-align:right;min-width:56px}
.rval{display:block;font-size:19px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.15}
.rval small{font-size:12px;font-weight:600;color:var(--dim);margin-left:2px}
.rval.live{color:var(--blue)}
.rval.live small{color:var(--muted)}
.offtxt{font-size:12px;font-weight:600;color:var(--amber)}
li.off .dest{color:var(--dim)}
li.off .rval{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1.6px}
.nextdep{grid-column:1/-1;display:none;font-size:10.5px;color:var(--muted);padding:2px 0 1px}
.nextdep.on{display:block}
.nextdep b{font-weight:700;color:var(--ink)}
.nextdep span{font-variant-numeric:tabular-nums;margin-left:5px}

/* prazno stanje */
.empty{display:none;text-align:center;padding:16px 8px 14px}
.empty.on{display:block}
.empty svg{width:30px;height:30px;color:var(--dim)}
.empty b{display:block;font-size:14.5px;font-weight:700;color:var(--navy);margin-top:7px}
.empty p{font-size:12.5px;color:var(--muted);margin-top:2px}

.cta{display:block;width:100%;text-decoration:none;margin-top:11px;border:0;border-radius:14px;background:var(--blue);color:#fff;
 padding:13px 14px;font-family:var(--font);text-align:center;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.cta b{display:block;font-size:18.5px;font-weight:700;letter-spacing:-.015em;line-height:1.18}
.cta i{display:block;font-style:normal;font-size:17px;font-weight:700;line-height:1.2;margin-top:1px;
 font-variant-numeric:tabular-nums}
.cta:active{background:var(--blue-dark);transform:translateY(1px)}

   {ln:'5A',cls:'l3',dest:'Puntamika',st:'ret',at:'15:52',veh:9},
   {ln:'8', cls:'l4',dest:'Kolodvor', st:'sched',at:'16:05',next:['17:05']}]},
 cancelled:{stop:'Mala pošta',dir:'smjer Kolodvor',
   disr:'Radovi na Obali kneza Trpimira, linija 5A ne prometuje do 15:30.',rows:[
   {ln:'1B',cls:'l1',dest:'Dračevac',st:'live',min:4},
   {ln:'5A',cls:'l3',dest:'Puntamika',st:'off',at:'16:00',why:'radovi na cesti'},
   {ln:'2', cls:'l2',dest:'Poluotok', st:'sched',at:'16:12',next:['16:42','17:12']}]},
 last:{stop:'Mala pošta',dir:'smjer Kolodvor',rows:[],first:'05:20'}
};
const ORDER=['mix','live','scheduled','returning','terminus','cancelled','last'];
let SC=new URLSearchParams(location.search).get('state');
if(ORDER.indexOf(SC)<0) SC='mix';

function row(r,idx){
  /* JEDAN RED: pilula + odrediste + vrijednost + strelica. Cijeli red je link. */
  const li=document.createElement('li');
  let val='', cls='', mid='<span class="dest">'+r.dest+'</span>';
  if(r.st==='live'||r.st==='term'){ val=WAVE+r.min+' <small>min</small>'; cls='live'; }
  else if(r.st==='ret'){ val=WAVE+r.at; cls='live'; }
  else if(r.st==='off'){ val=r.at; li.className='off';
    mid='<span class="dest">'+r.dest+'</span> <span class="offtxt">'+t('arr.cancelled',CUR)+'</span>'; }
  else { val=r.at; }
  li.innerHTML='<a class="rowlink" href="./linija.html?state='+
      (r.st==='live'?'live':r.st==='ret'?'notstarted':r.st==='term'?'terminus':'none')+'">'+
    '<span class="badge '+r.cls+'">'+r.ln+'</span>'+
    '<span class="mid">'+mid+'</span>'+
    '<span class="right"><span class="rval '+cls+'">'+val+'</span></span>'+
    '<svg class="chev" viewBox="0 0 8 13" fill="none" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
  return li;
}
function render(){
  const d=SCEN[SC];
  document.getElementById('stName').textContent=d.stop;
  document.getElementById('stDir').textContent=d.dir;
  const ul=document.getElementById('arrList'); ul.innerHTML='';
  d.rows.forEach((r,i)=>ul.appendChild(row(r,i)));
  const dz=document.getElementById('disr');
  dz.classList.toggle('on',!!d.disr);
  if(d.disr) document.getElementById('disrTxt').textContent=d.disr;
  const em=document.getElementById('empty');
  em.classList.toggle('on',d.rows.length===0);
  if(d.rows.length===0)
    document.getElementById('emptySub').textContent=t('arr.firstTomorrow',CUR).replace('{t}',d.first);
  const noMore=(d.rows.length===0);
  const cta=document.querySelector('.cta');
  cta.href = noMore ? './dolasci.html' : './kupi.html';
  document.getElementById('ctaMain').textContent = noMore ? t('line.schedule',CUR)
                                                          : t('cta.buySingle',CUR).replace(' · {price}','');
  document.getElementById('ctaSub').textContent = noMore ? '' : '1,50 €';
  cta.classList.toggle('cta--alt', noMore);
  document.querySelector('.hint').style.display = noMore ? 'none' : '';
  document.getElementById('dbtnLbl').textContent=t('demo.'+SC,CUR).toUpperCase();
}
/* jezici */
function buildLangs(){
  const ul=document.getElementById('llist'); ul.innerHTML='';
  const det=detectLang();
  const ord=[...LANGS].sort((a,b)=>(a.code===det?-1:0)-(b.code===det?-1:0));
  ord.forEach((l,i)=>{
    if(i===0&&l.code===det){const g=document.createElement('div');g.className='lgroup';
      g.textContent=t('lang.detected',CUR);ul.appendChild(g);}
    if(i===1&&ord[0].code===det){const g=document.createElement('div');g.className='lgroup';
      g.textContent='Svi jezici';ul.appendChild(g);}
    const li=document.createElement('li'),b=document.createElement('button');
    b.className='lrow';b.type='button';b.setAttribute('aria-selected',l.code===CUR);
    const done=Object.values(STRINGS[l.code]||{}).some(v=>v);
    b.innerHTML='<span class="lrow__nm">'+l.name+(done?'':'<span class="tag">'+t('lang.untranslated',CUR)+'</span>')+
      '</span><span class="lrow__sh">'+l.code.toUpperCase()+'</span>'+
      '<svg class="lrow__tick" viewBox="0 0 20 20" fill="none"><path d="M4 10.5 8 14.5 16 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.onclick=()=>{setLang(l.code);applyI18n();render();buildLangs();buildDemo();closeAll();};
    li.appendChild(b);ul.appendChild(li);
  });
}
function buildDemo(){
  const ul=document.getElementById('dlist'); ul.innerHTML='';
  ORDER.forEach(k=>{
    const li=document.createElement('li'),b=document.createElement('button');
    b.className='lrow';b.type='button';b.setAttribute('aria-selected',k===SC);
    b.innerHTML='<span class="lrow__nm">'+t('demo.'+k,CUR)+'</span>'+
      '<svg class="lrow__tick" viewBox="0 0 20 20" fill="none"><path d="M4 10.5 8 14.5 16 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.onclick=()=>{SC=k;render();buildDemo();closeAll();};
    li.appendChild(b);ul.appendChild(li);
  });
}
const scrim=document.getElementById('scrim');
function closeAll(){scrim.classList.remove('on');
  document.getElementById('lsheet').classList.remove('on');
  document.getElementById('dsheet').classList.remove('on');}
function openSh(id){scrim.classList.add('on');document.getElementById(id).classList.add('on');}
document.getElementById('langBtn').onclick=()=>openSh('lsheet');
document.getElementById('dbtn').onclick=()=>openSh('dsheet');
document.getElementById('lsX').onclick=closeAll;
document.getElementById('dsX').onclick=closeAll;
scrim.onclick=closeAll;
if(new URLSearchParams(location.search).get('chev')==='0') document.body.classList.add('nochev');
applyI18n(); render(); buildLangs(); buildDemo();

</script>
