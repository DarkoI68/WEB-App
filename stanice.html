<title>Stanice · Liburnija d.o.o.</title>
<link rel="stylesheet" href="./maplibre-gl.css">
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;
 --orange:#DA5D23;--purple:#6352C4;--amber:#B26B00;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
 -webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top__r1{display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top__nm{flex:1;font-size:21px;font-weight:700;letter-spacing:-.024em;color:var(--navy)}
.viewsw{display:flex;gap:2px;background:#EEF1F7;border-radius:9px;padding:2px;flex:none}
.viewsw button{border:0;background:none;border-radius:7px;padding:6px 11px;font-family:var(--font);
 font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
@media (max-width:340px){.viewsw button span{display:none}.viewsw button{padding:7px 9px}}
.viewsw button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,41,116,.14)}
.viewsw svg{width:13px;height:13px}
.search{margin-top:10px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:16px;height:16px;color:var(--dim);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;
 padding:11px 34px 11px 34px;font-family:var(--font);font-size:15px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--blue);background:#fff}
.search input::placeholder{color:var(--dim)}
.clr{position:absolute;right:8px;border:0;background:#E7EBF3;color:var(--muted);border-radius:50%;
 width:20px;height:20px;display:none;place-items:center;font-size:13px;line-height:1;padding:0}
.clr.on{display:grid}

.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px}
.wrap.hide{display:none}
.hd{position:sticky;top:0;z-index:2;background:var(--card);padding:13px 2px 6px;
 font-size:10.5px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--muted)}
ul.stops{list-style:none;padding:0}
ul.stops li{border-bottom:1px solid #EDF0F6}
ul.stops li:last-child{border-bottom:0}
.srow{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:4px;
 grid-template-areas:"nm chev" "lines chev";
 padding:11px 2px;text-decoration:none;color:inherit}
.srow:active{background:#F1F4FA;border-radius:10px}
.snm{grid-area:nm;font-size:16.5px;font-weight:600;letter-spacing:-.015em;color:var(--navy)}
.slines{grid-area:lines;display:flex;flex-wrap:wrap;gap:4px}
.lb{min-width:26px;height:19px;border-radius:5px;color:#fff;padding:0 5px;
 font-size:10.5px;font-weight:700;line-height:19px;text-align:center}
.l1{background:var(--orange)}.l2{background:var(--blue)}.l3{background:var(--purple)}
.l4{background:#0F7B6C}.l5{background:#B8437E}.l6{background:#3D6BB3}
.favmark{display:inline-grid;place-items:center;width:14px;height:14px;color:#E8A317;margin-left:6px;
 vertical-align:-1px}
.favmark svg{width:14px;height:14px}
.star{border:0;background:none;padding:7px;color:#C9D1DE;display:grid;place-items:center;flex:none}
.star svg{width:19px;height:19px}
.star.on{color:#E8A317}
.chev{grid-area:chev;width:11px;height:8px;color:#9AA6BC;flex:none;transition:transform .2s}
.srow{cursor:pointer}
.chev.up{transform:rotate(180deg)}
ul.stops li.open{background:#F4F7FC;border-radius:12px;margin:2px 0}
ul.stops li.open .snm{color:var(--blue)}
.dirs{padding:0 2px 10px}
.dirs__h{font-size:10px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--dim);
 padding:2px 0 7px}
.drow{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);
 border-radius:11px;padding:4px 6px 4px 11px;margin-bottom:7px}
.drow:last-child{margin-bottom:0}
.drow__go{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto auto;
 grid-template-areas:"code lines chev" "to lines chev";
 align-items:center;column-gap:10px;row-gap:2px;padding:7px 0;text-decoration:none;color:inherit}
.drow__go:active{opacity:.6}
.frow{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto auto;
 grid-template-areas:"nm lines chev" "to lines chev";
 align-items:center;column-gap:10px;row-gap:2px;padding:9px 0 9px 2px;text-decoration:none;color:inherit}
ul.stops li:has(.frow){display:flex;align-items:center;gap:4px}
.fnm{grid-area:nm;font-size:15.5px;font-weight:700;color:var(--navy);letter-spacing:-.015em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fto{grid-area:to;font-size:12px;color:var(--muted);line-height:1.3}
.flines{grid-area:lines;display:flex;flex-wrap:wrap;gap:3px;max-width:96px;justify-content:flex-end}
.frow .chev{grid-area:chev;width:8px;height:13px}
.dcode{grid-area:code;font-size:14.5px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.dtowards{grid-area:to;font-size:12.5px;color:var(--muted);line-height:1.35}
.dlines{grid-area:lines;display:flex;flex-wrap:wrap;gap:3px;max-width:96px;justify-content:flex-end}
.drow .chev{grid-area:chev;width:8px;height:13px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}
.empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:3px}

#mapwrap{flex:1 1 auto;min-height:0;position:relative;display:none}
#mapwrap.on{display:block}
#map{position:absolute;inset:0}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:#fff;border-radius:14px;
 padding:12px 14px;box-shadow:0 6px 24px rgba(0,41,116,.22);display:none}
.mapcard.on{display:block}
.mapcard__nm{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.mapcard__ln{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.mapcard__go{display:block;margin-top:11px;border:0;border-radius:11px;background:var(--blue);color:#fff;
 width:100%;padding:11px;font-family:var(--font);font-size:15px;font-weight:600;text-align:center;text-decoration:none}
.tilewarn{position:absolute;left:10px;right:10px;top:10px;z-index:4;background:rgba(10,35,66,.9);color:#fff;
 border-radius:9px;padding:8px 11px;font-size:11.5px;font-weight:600;text-align:center;display:none}
.tilewarn.on{display:block}
.maplibregl-ctrl-attrib{font-size:9px!important}

nav.tabs{flex:none;display:flex;background:rgba(249,249,251,.95);border-top:1px solid var(--line);
 padding:7px 0 calc(env(safe-area-inset-bottom) + 5px);
 -webkit-backdrop-filter:saturate(1.7) blur(14px);backdrop-filter:saturate(1.7) blur(14px)}
nav.tabs a{flex:1;min-width:0;text-decoration:none;color:#98A4BB;display:flex;flex-direction:column;
 align-items:center;gap:3px;font-family:var(--font);font-size:9.5px;font-weight:600;line-height:1.1;
 text-align:center;padding:0 1px}
nav.tabs a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs a[aria-current]{color:var(--blue)}
nav.tabs svg{width:20px;height:20px}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

/* srednji tab: istaknuto narancasto dugme za skeniranje */
nav.tabs{overflow:visible;position:relative;z-index:30}
nav.tabs a.scan{position:relative}
nav.tabs a.scan .fab{position:absolute;top:0;left:50%;transform:translate(-50%,-27px);
 width:58px;height:58px;border-radius:50%;background:#DA5D23;
 display:grid;place-items:center;box-shadow:0 6px 18px rgba(218,93,35,.45);
 border:4px solid #F9F9FB}
nav.tabs a.scan .fab svg{width:26px;height:26px;color:#fff;stroke:#fff}
nav.tabs a.scan span[data-i18n]{margin-top:36px}
nav.tabs a.scan[aria-current]{color:#BE4C1B}
nav.tabs a.scan[aria-current] .fab{background:#BE4C1B}
nav.tabs a.scan:active .fab{background:#A8420F;transform:translate(-50%,-25px)}
</style>

function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}
let CUR=(document.cookie.match(/(?:^|; )lang=([a-z]{2})/)||[])[1]||detectLang();
function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}
function applyI18n(){window.__pwaT=function(k){return t(k,CUR);};document.documentElement.lang=CUR;
 const b=document.getElementById('langCode'); if(b) b.textContent=CUR.toUpperCase();
 document.querySelectorAll('[data-i18n]').forEach(e=>{
   let s=t(e.dataset.i18n,CUR);
   if(e.dataset.price) s=s.replace('{price}',e.dataset.price);
   e.textContent=s;});}

const STAR_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8L12 3.6Z"/></svg>', STAR_ON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8L12 3.6Z"/></svg>', CHEV='<svg class="chev" viewBox="0 0 8 13" fill="none"><path d="M1 1l5.5 5.5L1 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TILE_URL='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_ATTR='© OpenStreetMap contributors';

/* Favorit je STUP (stanica + smjer), ne stanica. Kljuc: "Ime|A" */
function favGet(){ try{ return JSON.parse(localStorage.getItem('favStops')||'[]'); }catch(e){ return []; } }
function favSet(a){ try{ localStorage.setItem('favStops', JSON.stringify(a)); }catch(e){} }
function favKey(name,code){ return name+'|'+code; }
function isFav(name,code){ return favGet().indexOf(favKey(name,code))>=0; }
function stopHasFav(name){ return favGet().some(k=>k.split('|')[0]===name); }
function toggleFav(name,code){
  const f=favGet(), k=favKey(name,code), i=f.indexOf(k);
  if(i>=0) f.splice(i,1); else f.push(k);
  favSet(f); renderList();
}
function norm(s){ return s.toLowerCase()
  .replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').replace(/đ/g,'d'); }
function lineChips(lines){
  return lines.map(l=>'<span class="lb '+(LCLS[l]||'l2')+'">'+l+'</span>').join('');
}
function destText(dests){
  const cap=2;
  const nm=d=>(CUR==='hr' && DAT[d]) ? DAT[d] : d;
  if(dests.length<=cap) return dests.map(nm).join(', ');
  return dests.slice(0,cap).map(nm).join(', ') + (CUR==='hr'
    ? ' i još '+(dests.length-cap) : ' +'+(dests.length-cap));
}
function dirOf(name,code){ return (DIRS[name]||[]).find(d=>d[0]===code); }

let OPENSTOP=null;

/* redak smjera unutar rastvorene stanice: nosi zvjezdicu */
function dirRow(name,d){
  const [code,lines,dests]=d;
  const fav=isFav(name,code);
  const wrap=document.createElement('div'); wrap.className='drow';
  wrap.innerHTML=
    '<a class="drow__go" href="./index.html?stop='+encodeURIComponent(name)+'&dir='+code+'">'+
      '<span class="dcode">'+t(code==='A'?'dir.a':'dir.b',CUR)+'</span>'+
      '<span class="dtowards">'+t('dir.towards',CUR).replace('{d}',destText(dests))+'</span>'+
      '<span class="dlines">'+lineChips(lines)+'</span>'+CHEV+
    '</a>'+
    '<button class="star'+(fav?' on':'')+'" type="button" aria-label="'+
      t(fav?'stops.remFav':'stops.addFav',CUR)+'">'+(fav?STAR_ON:STAR_OFF)+'</button>';
  wrap.querySelector('.star').addEventListener('click',e=>{
    e.preventDefault(); e.stopPropagation(); toggleFav(name,code); });
  return wrap;
}

/* redak stanice u popisu: BEZ zvjezdice; puna zvjezdica samo kad je neki smjer favorit */
function stopLi(s){
  const li=document.createElement('li');
  const open=(OPENSTOP===s[0]);
  const marked=stopHasFav(s[0]);
  if(open) li.className='open';
  li.innerHTML='<div class="srow" role="button" tabindex="0">'+
      '<span class="snm">'+s[0]+(marked?'<span class="favmark">'+STAR_ON+'</span>':'')+'</span>'+
      '<span class="slines">'+lineChips(s[3])+'</span>'+
      '<svg class="chev'+(open?' up':'')+'" viewBox="0 0 12 8" fill="none"><path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '</div>';
  li.querySelector('.srow').addEventListener('click',()=>{
    OPENSTOP = open ? null : s[0]; renderList();
    if(!open) setTimeout(()=>{const el=document.querySelector('li.open');
      if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});},60); });
  if(open){
    const box=document.createElement('div'); box.className='dirs';
    const h=document.createElement('div'); h.className='dirs__h';
    h.textContent=t('dir.pick',CUR); box.appendChild(h);
    (DIRS[s[0]]||[]).forEach(d=>box.appendChild(dirRow(s[0],d)));
    li.appendChild(box);
  }
  return li;
}

/* favorit u svojoj sekciji: vodi ravno na stup */
function favLi(key){
  const [name,code]=key.split('|');
  const d=dirOf(name,code); if(!d) return null;
  const li=document.createElement('li');
  li.innerHTML=
    '<a class="frow" href="./index.html?stop='+encodeURIComponent(name)+'&dir='+code+'">'+
      '<span class="fnm">'+name+' · '+t(code==='A'?'dir.a':'dir.b',CUR)+'</span>'+
      '<span class="fto">'+t('dir.towards',CUR).replace('{d}',destText(d[2]))+'</span>'+
      '<span class="flines">'+lineChips(d[1])+'</span>'+CHEV+
    '</a>'+
    '<button class="star on" type="button" aria-label="'+t('stops.remFav',CUR)+'">'+STAR_ON+'</button>';
  li.querySelector('.star').addEventListener('click',e=>{
    e.preventDefault(); e.stopPropagation(); toggleFav(name,code); });
  return li;
}

function section(title,items){
  if(!items.length) return null;
  const f=document.createDocumentFragment();
  const h=document.createElement('div'); h.className='hd'; h.textContent=title; f.appendChild(h);
  const ul=document.createElement('ul'); ul.className='stops';
  items.forEach(s=>ul.appendChild(stopLi(s)));
  f.appendChild(ul); return f;
}
function renderList(){
  const body=document.getElementById('listBody'); body.innerHTML='';
  const q=norm(document.getElementById('q').value.trim());
  document.getElementById('clr').classList.toggle('on', q.length>0);
  const match=STOPS.filter(s=>!q || norm(s[0]).indexOf(q)>=0 ||
    s[3].some(l=>norm(l).indexOf(q)===0));

  if(!q){
    const favs=favGet();
    const h=document.createElement('div'); h.className='hd';
    h.textContent=t('stops.fav',CUR); body.appendChild(h);
    if(favs.length){
      const ul=document.createElement('ul'); ul.className='stops';
      favs.forEach(k=>{ const li=favLi(k); if(li) ul.appendChild(li); });
      body.appendChild(ul);
    } else {
      const e=document.createElement('div'); e.className='empty';
      e.textContent=t('stops.emptyFav',CUR); body.appendChild(e);
    }
  }

  if(!match.length){
    body.innerHTML+='<div class="empty"><b>'+t('stops.none',CUR)+'</b></div>'; return;
  }
  const h2=document.createElement('div'); h2.className='hd';
  h2.textContent=t('stops.all',CUR); body.appendChild(h2);
  const ul2=document.createElement('ul'); ul2.className='stops';
  match.slice().sort((a,b)=>a[0].localeCompare(b[0],'hr')).forEach(s=>ul2.appendChild(stopLi(s)));
  body.appendChild(ul2);
}
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('clr').addEventListener('click',()=>{
  const q=document.getElementById('q'); q.value=''; q.focus(); renderList(); });

/* ---------- karta ---------- */
let MAP=null;
function initMap(){
  if(MAP || typeof maplibregl==='undefined') return;
  const lats=STOPS.map(s=>s[1]), lngs=STOPS.map(s=>s[2]);
  MAP=new maplibregl.Map({container:'map',attributionControl:false,dragRotate:false,
    style:{version:8,sources:{osm:{type:'raster',tiles:[TILE_URL],tileSize:256,attribution:TILE_ATTR,maxzoom:19}},
      layers:[{id:'bg',type:'background',paint:{'background-color':'#E8EEF2'}},
              {id:'osm',type:'raster',source:'osm'}]},
    bounds:[[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],
    fitBoundsOptions:{padding:{top:40,bottom:120,left:34,right:34}}});
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  MAP.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
  let ok=false;
  MAP.on('data',e=>{ if(e.sourceId==='osm'&&e.isSourceLoaded) ok=true; });
  setTimeout(()=>{ if(!ok){ const w=document.getElementById('tileWarn');
    w.textContent='Podloga karte nije dostupna. Stanice su i dalje točne.'; w.classList.add('on'); } },6000);
  MAP.on('style.load',()=>{
    STOPS.forEach(s=>{
      const el=document.createElement('div');
      el.style.cssText='width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #0063F0;'+
        'box-shadow:0 1px 5px rgba(0,41,116,.35);cursor:pointer';
      el.addEventListener('click',()=>{
        document.getElementById('mcNm').textContent=s[0];
        document.getElementById('mcLn').innerHTML=lineChips(s[3]);
        const go=document.getElementById('mcGo');
        go.textContent=t('tabs.arrivals',CUR)+' · '+s[0];
        go.href='./index.html?stop='+encodeURIComponent(s[0]);
        document.getElementById('mapCard').classList.add('on');
        MAP.easeTo({center:[s[2],s[1]],duration:320});
      });
      new maplibregl.Marker({element:el}).setLngLat([s[2],s[1]]).addTo(MAP);
    });
  });
}
function setView(mapOn){
  document.getElementById('vList').setAttribute('aria-selected',String(!mapOn));
  document.getElementById('vMap').setAttribute('aria-selected',String(mapOn));
  document.getElementById('listView').classList.toggle('hide',mapOn);
  document.getElementById('mapwrap').classList.toggle('on',mapOn);
  document.querySelector('.search').style.display = mapOn?'none':'flex';
  if(mapOn){ initMap(); setTimeout(()=>MAP&&MAP.resize(),60); }
  else document.getElementById('mapCard').classList.remove('on');
}
document.getElementById('vList').onclick=()=>setView(false);
document.getElementById('vMap').onclick=()=>setView(true);

applyI18n();
document.getElementById('q').placeholder=t('stops.search',CUR);
renderList();

</script>
