<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Kupi kartu · Liburnija d.o.o.</title>
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
 -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 9px) 14px 10px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:16px;height:16px}
.top h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--navy)}
.wrap{flex:1 1 auto;padding:14px 14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}
.foot{flex:none;position:sticky;bottom:0;background:rgba(249,249,251,.97);border-top:1px solid var(--line);
 padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:15px 14px;
 font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center;
 text-decoration:none;box-shadow:0 5px 16px rgba(0,99,240,.26)}
.btn:active{background:var(--blue-dark);transform:translateY(1px)}
.btn[disabled],.btn.off{background:#DDE3EC;color:#9AA6BC;box-shadow:none;pointer-events:none}
.btn2{display:block;width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);
 padding:13px;font-family:var(--font);font-size:15px;font-weight:600;text-align:center;text-decoration:none}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

.hdrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tname{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.tvalid{font-size:12.5px;color:var(--muted);margin-top:2px}
.paxrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;
 padding-top:14px;border-top:1px solid var(--line)}
.paxlbl{font-size:15.5px;font-weight:600;color:var(--navy)}
.paxnote{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px;max-width:190px}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;
 font-size:20px;font-weight:600;color:var(--navy);line-height:1;display:grid;place-items:center}
.stepper button:disabled{color:#C9D1DE;background:#F4F6FA}
.stepper span{min-width:34px;text-align:center;font-size:19px;font-weight:700;color:var(--navy);
 font-variant-numeric:tabular-nums}
.sum{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;
 border-top:1px solid var(--line)}
.sum__l{font-size:13px;color:var(--muted)}
.sum__r{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=email]{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;
 font-family:var(--font);font-size:15.5px;color:var(--ink);background:var(--card)}
input:focus{outline:none;border-color:var(--blue);background:#fff}
.hintline{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:2px 0}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid #C3CBD9;
 border-radius:6px;flex:none;margin-top:1px;background:#fff;position:relative}
.chk input:checked{background:var(--blue);border-color:var(--blue)}
.chk input:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;
 border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk span{font-size:14.5px;line-height:1.35}
#r1box{display:none;margin-top:12px}
#r1box.on{display:block}
#r1box .f+.f{margin-top:10px}
.docs{margin-top:10px}
.docs__t{font-size:12px;color:var(--muted);margin-bottom:7px}
.docs a{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#fff;
 border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--navy);font-size:14.5px;
 font-weight:500;margin-bottom:7px}
.docs a:last-child{margin-bottom:0}
.docs svg{width:8px;height:13px;color:#C9D1DE}
.acceptbox{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="./index.html" aria-label="Natrag"><svg viewBox="0 0 16 16" fill="none"><path d="M10 2 4 8l6 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1 data-i18n="buy.title"></h1>
</div>
<div class="wrap">
  <div class="card">
    <div class="hdrow"><div>
      <div class="tname" data-i18n="buy.title"></div>
      <div class="tvalid" data-i18n="buy.valid"></div>
    </div></div>
    <div class="paxrow">
      <div><span class="paxlbl" data-i18n="buy.pax"></span>
        <span class="paxnote" data-i18n="buy.paxNote"></span></div>
      <div class="stepper">
        <button id="minus" type="button" aria-label="−">−</button>
        <span id="pax">1</span>
        <button id="plus" type="button" aria-label="+">+</button>
      </div>
    </div>
    <div class="sum">
      <span class="sum__l"><span id="perPax"></span></span>
      <span class="sum__r" id="total">1,50 €</span>
    </div>
  </div>

  <div class="card">
    <div class="f">
      <label class="fl" for="email" data-i18n="buy.email"></label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <p class="hintline" data-i18n="buy.emailNote"></p>
    </div>
    <div style="margin-top:13px">
      <label class="chk"><input id="r1" type="checkbox"><span data-i18n="buy.r1"></span></label>
      <div id="r1box">
        <div class="f"><label class="fl" for="co" data-i18n="buy.company"></label><input id="co" type="text"></div>
        <div class="f"><label class="fl" for="oib" data-i18n="buy.oib"></label><input id="oib" type="text" inputmode="numeric" maxlength="11"></div>
        <div class="f"><label class="fl" for="adr" data-i18n="buy.addr"></label><input id="adr" type="text"></div>
      </div>
    </div>
  </div>

  <div class="docs">
    <div class="docs__t" data-i18n="buy.docs"></div>
    <a href="./uvjeti.html"><span data-i18n="about.terms"></span><svg viewBox="0 0 8 13" fill="none"><path d="M1 1l5.5 5.5L1 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="./privatnost.html"><span data-i18n="about.privacy"></span><svg viewBox="0 0 8 13" fill="none"><path d="M1 1l5.5 5.5L1 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="./pravna-obavijest.html"><span data-i18n="about.legal"></span><svg viewBox="0 0 8 13" fill="none"><path d="M1 1l5.5 5.5L1 12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>

  <div class="acceptbox">
    <label class="chk"><input id="accept" type="checkbox"><span data-i18n="buy.accept"></span></label>
  </div>
</div>
<div class="foot">
  <button class="btn off" id="payBtn" type="button" disabled></button>
</div>

const PSEUDO=new URLSearchParams(location.search).has('pseudo');
function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}
let CUR=(document.cookie.match(/(?:^|; )lang=([a-z]{2})/)||[])[1]||detectLang();
function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}
function applyI18n(){document.documentElement.lang=CUR;
 const b=document.getElementById('langCode'); if(b) b.textContent=CUR.toUpperCase();
 document.querySelectorAll('[data-i18n]').forEach(e=>{
   let s=t(e.dataset.i18n,CUR);
   if(e.dataset.price) s=s.replace('{price}',e.dataset.price);
   e.textContent=s;});}

const PRICE=1.5;
function eur(n){ return n.toFixed(2).replace('.',',')+' €'; }
function orderStore(){ try{ return JSON.parse(localStorage.getItem('orders')||'{}'); }catch(e){ return {}; } }
function orderSave(o){ try{ const s=orderStore(); s[o.no]=o; localStorage.setItem('orders',JSON.stringify(s));
  localStorage.setItem('lastOrder',o.no);}catch(e){} }
function orderGet(no){ return orderStore()[no]||null; }
function mkOrderNo(){ const d=new Date();
  return 'ZD-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+
    String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function mkTicketNo(){ const p=()=>Math.random().toString(36).slice(2,6).toUpperCase();
  return p()+'-'+p()+'-'+p(); }

let pax=1;
function upd(){
  document.getElementById('pax').textContent=pax;
  document.getElementById('minus').disabled=(pax<=1);
  document.getElementById('plus').disabled=(pax>=6);
  const total=pax*PRICE;
  document.getElementById('total').textContent=eur(total);
  document.getElementById('perPax').textContent=t('buy.perPax',CUR)+' × '+pax;
  document.getElementById('payBtn').textContent=t('buy.pay',CUR).replace('{total}',eur(total));
}
document.getElementById('minus').onclick=()=>{ if(pax>1){pax--;upd();} };
document.getElementById('plus').onclick=()=>{ if(pax<6){pax++;upd();} };
document.getElementById('r1').onchange=e=>document.getElementById('r1box').classList.toggle('on',e.target.checked);
const accept=document.getElementById('accept'), payBtn=document.getElementById('payBtn');
accept.onchange=()=>{ payBtn.disabled=!accept.checked; payBtn.classList.toggle('off',!accept.checked); };
payBtn.onclick=()=>{
  const o={no:mkOrderNo(), pax:pax, total:pax*PRICE, email:document.getElementById('email').value.trim(),
    r1:document.getElementById('r1').checked?{co:co.value,oib:oib.value,adr:adr.value}:null,
    status:'pending', created:Date.now()};
  orderSave(o);
  location.href='./narudzba.html?no='+encodeURIComponent(o.no);
};
applyI18n(); upd();
