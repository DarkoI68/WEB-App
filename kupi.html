<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Kupi kartu · Liburnija d.o.o.</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--blue:#0063F0;--blue-dark:#004FC4;--navy:#002974;--ink:#0A2342;--green:#12693A;--green-bg:#E7F6EC;
 --amber:#B26B00;--amber-bg:#FFF6E3;--amber-line:#F2D9A8;
 --card:#F9F9FB;--line:#E3E7F0;--muted:#6B7A99;--dim:#9AA6BC;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;
 -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 10px) 14px 11px;display:flex;align-items:center;gap:11px}
.back{border:0;background:#F1F4FA;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;
 flex:none;color:var(--navy);text-decoration:none}
.back svg{width:17px;height:17px}
.top h1{flex:1;font-size:20px;font-weight:700;letter-spacing:-.022em;color:var(--navy)}
.wrap{flex:1 1 auto;padding:30px 16px 0}
.q{font-size:21px;font-weight:700;color:var(--navy);letter-spacing:-.022em;margin:0 2px 20px}
@media (max-width:380px){
  .wrap{padding-left:12px;padding-right:12px}
  .tcard{padding:15px 12px;column-gap:8px}
  .tcard__n{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcard__s{font-size:12.5px}
  .tcard__p{font-size:19px}
  .tcard__c{width:8px}
}
@media (max-width:340px){
  .tcard__n{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2}
}
@media (max-height:700px){
  .wrap{padding-top:20px}
  .q{margin-bottom:15px;font-size:20px}
  .tlist{gap:11px}
  .tcard{padding:16px 15px}
  .footnote{padding:16px 8px 18px}
}
@media (min-width:520px){body{max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(10,35,66,.14)}}

.tlist{display:grid;gap:13px}
.tcard{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:12px;row-gap:4px;
 grid-template-areas:"nm price chev" "sub price chev";
 background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:19px 16px;
 text-decoration:none;color:inherit;font-family:var(--font);text-align:left;width:100%}
.tcard:active{background:#EFF4FC;border-color:var(--blue)}
.tcard__n{grid-area:nm;font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.tcard__s{grid-area:sub;font-size:14px;color:var(--muted);line-height:1.35}
.tcard__p{grid-area:price;font-size:22px;font-weight:800;color:var(--navy);white-space:nowrap;
 font-variant-numeric:tabular-nums}
.tcard__c{grid-area:chev;width:9px;height:15px;color:#C3CBD9}
.lock{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:var(--amber-bg);color:var(--amber);
 border-radius:7px;padding:4px 8px;font-size:11.5px;font-weight:700}
.lock svg{width:12px;height:12px}
.footnote{padding:22px 8px 24px;text-align:center;font-size:13.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

</div>
<div class="wrap">

  <div class="tlist" id="list"></div>
  <p class="footnote" data-i18n="tkt.transfersIncl"></p>
</div>

const PSEUDO=new URLSearchParams(location.search).has('pseudo');
function pseudo(s){if(!s)return s;const m={a:'\u00e1',e:'\u00ea',i:'\u00ef',o:'\u00f6',u:'\u00fc',c:'\u00e7',s:'\u0161',z:'\u017e'};
 let o=s.replace(/\{[^}]+\}/g,x=>'\u0000'+x+'\u0000').split('\u0000')
   .map((p,i)=>i%2?p:p.replace(/[aeioucsz]/g,c=>m[c]||c)).join('');
 return o+' '+'\u00b7'.repeat(Math.max(2,Math.ceil(s.length*0.4)));}
function t(k,l){const b=STRINGS[l]||{};let v=b[k]||(STRINGS.en||{})[k]||(STRINGS.hr||{})[k]||k;return PSEUDO?pseudo(v):v;}
function detectLang(){const w=(navigator.languages||[navigator.language||'hr']).map(x=>String(x).slice(0,2).toLowerCase());
 for(const x of w) if(LANGS.some(l=>l.code===x)) return x; return 'en';}
let CUR=(document.cookie.match(/(?:^|; )lang=([a-z]{2})/)||[])[1]||detectLang();
function setLang(c){CUR=c;try{document.cookie='lang='+c+';path=/;max-age=31536000;samesite=lax';}catch(e){}}
function applyI18n(){document.documentElement.lang=CUR;
 const b=document.getElementById('langCode'); if(b) b.textContent=CUR.toUpperCase();
 document.querySelectorAll('[data-i18n]').forEach(e=>{
   let s=t(e.dataset.i18n,CUR);
   if(e.dataset.price) s=s.replace('{price}',e.dataset.price);
   e.textContent=s;});}
